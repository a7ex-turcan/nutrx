<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Log sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
input::placeholder{color:#7A887F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2A3A31; color: #0E1A13; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 48px; height: 60px; border-radius: 30px 30px 0 0; background: #C9D1C8; opacity: 0.55"></div>

  <section aria-label="Log Vitamin D" style="position: absolute; left: 0; right: 0; top: 62px; bottom: 0; background: #FFFFFF; border-radius: 38px 38px 0 0; display: flex; flex-direction: column; padding: 8px 20px 0 20px; box-sizing: border-box">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #D2D8D0"></div>

    <div style="display: flex; align-items: center; gap: 14px; margin-top: 18px">
      <div style="position: relative; width: 56px; height: 56px; flex: none">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#E5A50026" stroke-width="5"></circle>
          <circle cx="28" cy="28" r="24" fill="none" stroke="#E5A500" stroke-width="5" stroke-linecap="round" stroke-dasharray="75.4 150.8" transform="rotate(-90 28 28)"></circle>
        </svg>
        <svg style="position: absolute; left: 16px; top: 16px" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E5A500" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Vitamin D</h1>
        <div style="font-size: 14px; color: #56655C"><span style="font: 600 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #0E1A13">2,000</span> of 4,000 IU today</div>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #EEF1EC; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56655C" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="margin-top: 24px; padding: 18px 12px; border-radius: 24px; background: #F2F4EF; display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <button aria-label="Decrease amount" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 2px rgba(14,26,19,0.08)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0">
        <label for="amt" style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #56655C">Amount</label>
        <div style="display: flex; align-items: baseline; gap: 6px">
          <input id="amt" value="1,000" inputmode="decimal" style="width: 150px; border: 0; background: transparent; text-align: right; font: 700 52px/1.05 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: -0.03em; color: #0E1A13; padding: 0; outline: none">
          <span style="font: 600 20px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #56655C">IU</span>
        </div>
      </div>
      <button aria-label="Increase amount" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 2px rgba(14,26,19,0.08)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
    </div>

    <div role="group" aria-label="Quick amounts" style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap">
      <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D5DCD3; background: #FFFFFF; font: 600 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #0E1A13; cursor: pointer">500</button>
      <button aria-pressed="true" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #1B3B2D; background: #1B3B2D; font: 600 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #FFFFFF; cursor: pointer">1,000</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #D5DCD3; background: #FFFFFF; font: 600 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #0E1A13; cursor: pointer">2,000</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px dashed #1EB955; background: #EAF8EF; font: 600 15px -apple-system, system-ui, sans-serif; color: #137A3A; cursor: pointer">Fill to goal</button>
    </div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px">
      <label for="note" style="font-size: 13px; font-weight: 600; color: #56655C">Note</label>
      <input id="note" placeholder="e.g. with breakfast" style="height: 48px; border-radius: 14px; border: 1.5px solid #E1E6DF; background: #FFFFFF; padding: 0 14px; font: 400 16px -apple-system, system-ui, sans-serif; color: #0E1A13; outline: none">
    </div>

    <button style="margin-top: 16px; height: 56px; border-radius: 18px; border: 0; background: #1B3B2D; color: #FFFFFF; font: 600 17px -apple-system, system-ui, sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7BE3A0" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      Log 1,000 IU
    </button>

    <div style="margin-top: 26px; display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Logged today</h2>
      <span style="font-size: 13px; color: #56655C">2 entries</span>
    </div>

    <ol style="list-style: none; margin: 8px 0 0 0; padding: 0; display: flex; flex-direction: column">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="2">
        <li style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid #EEF1EC">
          <span style="width: 48px; font: 600 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #56655C">{{e.time}}</span>
          <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #E5A500; flex: none"></span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font: 700 16px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{e.amount}}</span>
            <span style="font-size: 13px; color: #56655C">{{e.note}}</span>
          </div>
          <button aria-label="Delete entry" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA69F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
          </button>
        </li>
      </sc-for>
    </ol>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      entries: [
        { time: '08:12', amount: '+1,000 IU', note: 'with breakfast' },
        { time: '12:40', amount: '+1,000 IU', note: 'Widget' }
      ]
    };
  }
}
</script>
</body>
</html>
