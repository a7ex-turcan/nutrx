<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — My Nutrients</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1B3B2D}a:hover{color:#0E1A13}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F4EF; color: #0E1A13; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 62px 20px 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 10px">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">My Nutrients</h1>
    <div style="display: flex; gap: 8px">
      <a href="NutrientForm.dc.html" aria-label="Add nutrient" style="width: 44px; height: 44px; border-radius: 22px; background: #1B3B2D; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </a>
      <button aria-label="Profile menu" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #DCE7DF; color: #1B3B2D; font: 600 17px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; cursor: pointer">A</button>
    </div>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="margin-top: 20px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 8px 20px">
        <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #56655C">{{g.name}}</h2>
        <span style="font-size: 13px; color: #56655C">{{g.count}}</span>
      </div>
      <div style="margin: 0 16px; border-radius: 22px; background: #FFFFFF; overflow: hidden; box-shadow: 0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)">
        <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
          <a href="Analytics.dc.html" style="min-height: 68px; padding: 0 14px 0 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0E1A13; border-bottom: {{n.sep}}">
            <span aria-hidden="true" style="width: 42px; height: 42px; border-radius: 13px; background: {{n.tile}}; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.tint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
            </span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <span style="font-size: 16px; font-weight: 600">{{n.name}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #56655C">
                <span style="padding: 2px 7px; border-radius: 6px; background: #EEF1EC; font-size: 11px; font-weight: 700; color: #3D4B43">{{n.goal}}</span>
                <span>{{n.target}}</span>
                <sc-if value="{{n.hasReminder}}" hint-placeholder-val="{{false}}">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#56655C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-label="Has reminders" role="img"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg>
                </sc-if>
              </span>
            </span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA69F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="margin: 14px 16px 0 16px">
    <button style="width: 100%; height: 52px; border-radius: 18px; border: 1.5px dashed #B9C4BC; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px -apple-system, system-ui, sans-serif; color: #1B3B2D; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B3B2D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3zM12 12v4M10 14h4"></path></svg>
      New group
    </button>
  </div>

  <nav aria-label="Tabs" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: rgba(255,255,255,0.72); border: 1px solid rgba(14,26,19,0.08); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: 0 12px 32px -12px rgba(14,26,19,0.35)">
    <a href="Main.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: #56655C; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 8a4 4 0 1 0 4 4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Today</span>
    </a>
    <a href="Nutrients.dc.html" style="width: 92px; height: 54px; border-radius: 28px; background: rgba(27,59,45,0.10); color: #1B3B2D; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10.5 11 5 20 4c0 9-5.5 15-14 15zM5 19l7-7"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Nutrients</span>
    </a>
    <a href="History.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: #56655C; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v15H4zM4 10h16M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">History</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var I = {
      sun: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      fish: 'M2.5 12c2.8-3.6 7.5-5 11.5-3.2L18.5 6v12L14 15.2C10 17 5.3 15.6 2.5 12zM8 11.5v.01',
      pill: 'M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7zM7 7l7 7',
      drop: 'M12 3c0 0 6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
      dumbbell: 'M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11',
      cup: 'M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2.5M12 3.5v2.5'
    };
    function n(name, icon, tint, tile, goal, target, rem, last) {
      return { name: name, icon: I[icon], tint: tint, tile: tile, goal: goal, target: target, hasReminder: rem,
        sep: last ? '0' : '1px solid #EEF1EC' };
    }
    return {
      groups: [
        { name: 'Morning stack', count: '3', items: [
          n('Vitamin D', 'sun', '#C48C00', '#FCF1D2', 'AT LEAST', '4,000 IU', true),
          n('Omega-3', 'fish', '#0F8A84', '#D6F1EF', 'AT LEAST', '2,000 mg', true),
          n('Magnesium', 'pill', '#6B5BE0', '#E6E3FB', 'AT LEAST', '400 mg', false, true)
        ]},
        { name: 'Through the day', count: '3', items: [
          n('Water', 'drop', '#2F80ED', '#DCE9FC', 'AT LEAST', '2.5 L', true),
          n('Protein', 'dumbbell', '#D2563A', '#FBE3DD', 'BETWEEN', '120–160 g', false),
          n('Caffeine', 'cup', '#8A5C3B', '#F0E6DE', 'AT MOST', '400 mg', false, true)
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
