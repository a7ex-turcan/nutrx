<x-dc>
<helmet>

  <section aria-label="Settings" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: #F2F4EF; border-radius: 38px 38px 0 0; padding: 8px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column">

      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Settings</h1>
      <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: #FFFFFF; font: 600 16px -apple-system, system-ui, sans-serif; color: #1B3B2D; cursor: pointer">Done</button>
    </div>

    <button style="margin-top: 16px; width: 100%; border: 0; text-align: left; cursor: pointer; padding: 14px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; gap: 14px; font-family: inherit; color: #0E1A13">
      <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: #1B3B2D; color: #7BE3A0; display: flex; align-items: center; justify-content: center; font: 700 24px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">A</span>

        <span style="font-size: 18px; font-weight: 700">Alex</span>

      </span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA69F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <div style="margin-top: 20px; border-radius: 22px; background: #FFFFFF; overflow: hidden">
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <button style="width: 100%; min-height: 56px; border: 0; border-bottom: {{r.sep}}; background: transparent; padding: 0 14px; display: flex; align-items: center; gap: 12px; font: 400 16px -apple-system, system-ui, sans-serif; color: #0E1A13; cursor: pointer; text-align: left">
            <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 9px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
            </span>
            <span style="flex: 1">{{r.label}}</span>
            <span style="color: #56655C; font-size: 15px">{{r.value}}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA69F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </sc-for>
      </div>
    </sc-for>

    <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#56655C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #56655C; max-width: 260px">Private by design. No accounts, no servers, no tracking. Your data lives on your devices and your iCloud.</p>
    </div>
  </section>
</div>
</x-dc>

    return {
      sections: [

          r('iCloud Sync', 'On', '#2F80ED', 'M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z'),

}
</script>
