<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#137A3A}a:hover{color:#0E5C2B}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 62px 20px 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.ink2}}">Monday, 12 October</div>
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">Today</h1>
    </div>
    <button aria-label="Profile menu" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.avatarBg}}; color: {{c.avatarInk}}; font: 600 17px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; cursor: pointer">A</button>
  </div>

  <section style="margin: 16px 16px 0 16px; padding: 20px; border-radius: 28px; background: {{c.heroBg}}; display: flex; align-items: center; gap: 20px; box-shadow: 0 18px 40px -22px rgba(27,59,45,0.55)">
    <div style="position: relative; width: 116px; height: 116px; flex: none">
      <svg width="116" height="116" viewBox="0 0 116 116" aria-hidden="true">
        <sc-for list="{{segments}}" as="s" hint-placeholder-count="6">
          <circle cx="58" cy="58" r="50" fill="none" stroke="{{s.color}}" stroke-width="11" stroke-linecap="round" stroke-dasharray="35.4 278.8" stroke-dashoffset="{{s.offset}}" transform="rotate(-90 58 58)"></circle>
        </sc-for>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0">
        <div style="font: 700 34px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #FFFFFF; letter-spacing: -0.02em">3<span style="color: #9FC2AE">/6</span></div>
        <div style="font-size: 12px; font-weight: 600; color: #B7CCBF; margin-top: 4px">goals met</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; min-width: 0">
      <div style="font-size: 20px; line-height: 25px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.01em; text-wrap: pretty">Halfway there — 3 to go</div>
      <div style="display: flex; align-items: center; gap: 6px; align-self: flex-start; padding: 6px 10px 6px 8px; border-radius: 999px; background: rgba(255,255,255,0.10)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#7BE3A0" aria-hidden="true"><path d="M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z"></path></svg>
        <span style="font: 600 13px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #FFFFFF">10-day streak</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #B7CCBF">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B7CCBF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"></path></svg>
        <span>Vitamin D at 13:00</span>
      </div>
    </div>
  </section>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
    <div style="margin-top: 22px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 0 20px 10px 20px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em">{{g.name}}</h2>
        <span style="font: 600 13px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink2}}; padding: 4px 8px; border-radius: 999px; background: {{c.chip}}">{{g.count}}</span>
        <div style="flex: 1"></div>
        <button aria-label="Collapse group" style="width: 44px; height: 32px; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-end; padding: 0; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
        <sc-for list="{{g.items}}" as="n" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.cardShadow}}">
            <div style="position: relative; width: 52px; height: 52px; flex: none">
              <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
                <circle cx="26" cy="26" r="22" fill="none" stroke="{{n.track}}" stroke-width="5"></circle>
                <circle cx="26" cy="26" r="22" fill="none" stroke="{{n.ring}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{n.dash}}" transform="rotate(-90 26 26)"></circle>
              </svg>
              <svg style="position: absolute; left: 15px; top: 15px" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.tint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
              <sc-if value="{{n.done}}" hint-placeholder-val="{{false}}">
                <div style="position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 10px; background: #1EB955; border: 2px solid {{c.card}}; display: flex; align-items: center; justify-content: center">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
                </div>
              </sc-if>
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
              <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em">{{n.name}}</div>
              <div style="display: flex; align-items: baseline; gap: 4px">
                <span style="font: 700 16px/1.2 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{n.cur}}</span>
                <span style="font-size: 13px; color: {{c.ink2}}">{{n.of}}</span>
              </div>
              <div style="font-size: 12px; font-weight: 600; color: {{n.statusColor}}">{{n.status}}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; flex: none">
              <button aria-label="Remove one step of {{n.name}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid {{c.ghost}}; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
              </button>
              <button aria-label="Add one step of {{n.name}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.btn}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.btnInk}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <nav aria-label="Tabs" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: {{c.glass}}; border: 1px solid {{c.glassBorder}}; backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: 0 12px 32px -12px rgba(14,26,19,0.35)">
    <a href="Main.dc.html" style="width: 92px; height: 54px; border-radius: 28px; background: {{c.tabActiveBg}}; color: {{c.tabActive}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 8a4 4 0 1 0 4 4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Today</span>
    </a>
    <a href="Nutrients.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: {{c.ink2}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10.5 11 5 20 4c0 9-5.5 15-14 15zM5 19l7-7"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Nutrients</span>
    </a>
    <a href="History.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: {{c.ink2}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v15H4zM4 10h16M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">History</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = !!this.props.dark;
    var c = dark ? {
      bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chip: 'rgba(255,255,255,0.07)',
      cardShadow: 'inset 0 0 0 1px rgba(255,255,255,0.05)',
      heroBg: '#1B3B2D', avatarBg: '#1B3B2D', avatarInk: '#7BE3A0',
      ghost: '#2C4035', btn: '#1EB955', btnInk: '#0A130E',
      glass: 'rgba(28,42,34,0.72)', glassBorder: 'rgba(255,255,255,0.08)',
      tabActiveBg: 'rgba(30,185,85,0.16)', tabActive: '#7BE3A0',
      green: '#5BD88A', amber: '#F0B35A'
    } : {
      bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chip: 'rgba(14,26,19,0.06)',
      cardShadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)',
      heroBg: '#1B3B2D', avatarBg: '#DCE7DF', avatarInk: '#1B3B2D',
      ghost: '#D5DCD3', btn: '#1B3B2D', btnInk: '#FFFFFF',
      glass: 'rgba(255,255,255,0.72)', glassBorder: 'rgba(14,26,19,0.08)',
      tabActiveBg: 'rgba(27,59,45,0.10)', tabActive: '#1B3B2D',
      green: '#137A3A', amber: '#9A5A0C'
    };
    var I = {
      sun: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      fish: 'M2.5 12c2.8-3.6 7.5-5 11.5-3.2L18.5 6v12L14 15.2C10 17 5.3 15.6 2.5 12zM8 11.5v.01',
      pill: 'M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7zM7 7l7 7',
      drop: 'M12 3c0 0 6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
      dumbbell: 'M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11',
      cup: 'M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2.5M12 3.5v2.5'
    };
    var C = 138.23;
    function n(name, icon, tint, frac, cur, of, status, kind, done) {
      var color = kind === 'done' ? c.green : (kind === 'warn' ? c.amber : c.ink2);
      var ring = kind === 'warn' ? '#E08A1E' : tint;
      return { name: name, icon: I[icon], tint: tint, ring: ring, track: tint + (dark ? '33' : '26'),
        dash: (Math.min(frac, 1) * C).toFixed(1) + ' ' + C, cur: cur, of: of,
        status: status, statusColor: color, done: !!done };
    }
    var groups = [
      { name: 'Morning stack', count: '2/3', items: [
        n('Vitamin D', 'sun', '#E5A500', 0.5, '2,000', '/ 4,000 IU', '2,000 IU to go', 'todo'),
        n('Omega-3', 'fish', '#13A39C', 1, '2,000', '/ 2,000 mg', 'Done', 'done', true),
        n('Magnesium', 'pill', '#6B5BE0', 1, '400', '/ 400 mg', 'Done', 'done', true)
      ]},
      { name: 'Through the day', count: '1/3', items: [
        n('Water', 'drop', '#2F80ED', 0.6, '1.5', '/ 2.5 L', '1 L to go', 'todo'),
        n('Protein', 'dumbbell', '#E2674A', 0.58, '92', '/ 120–160 g', '28 g to range', 'todo'),
        n('Caffeine', 'cup', '#9B6A45', 0.8, '320', 'max 400 mg', '80 mg left today', 'warn')
      ]}
    ];
    var met = [true, true, true, false, false, false];
    var seg = 52.36;
    var segments = met.map(function (m, i) {
      return { color: m ? '#1EB955' : 'rgba(255,255,255,0.13)', offset: (-(i * seg) - 8.5).toFixed(2) };
    });
    return { c: c, groups: groups, segments: segments };
  }
}
</script>
</body>
</html>
