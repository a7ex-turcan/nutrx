<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1B3B2D}a:hover{color:#0E1A13}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F4EF; color: #0E1A13; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 62px 20px 0 20px; display: flex; align-items: flex-end; justify-content: space-between">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">History</h1>
    <button aria-label="Profile menu" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #DCE7DF; color: #1B3B2D; font: 600 17px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; cursor: pointer">A</button>
  </div>

  <section aria-label="Streaks" style="margin: 16px 16px 0 16px; padding: 18px 20px; border-radius: 24px; background: #1B3B2D; color: #FFFFFF; display: flex; align-items: center; gap: 16px">
    <div aria-hidden="true" style="width: 52px; height: 52px; border-radius: 26px; background: rgba(123,227,160,0.16); display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#7BE3A0"><path d="M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z"></path></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font: 700 28px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: -0.02em">10 days</span>
      <span style="font-size: 13px; color: #B7CCBF">Current streak · every goal met</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.14)">
      <span style="font: 700 22px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">31</span>
      <span style="font-size: 13px; color: #B7CCBF">Best</span>
    </div>
  </section>

  <section aria-label="October 2026" style="margin: 12px 16px 0 16px; padding: 16px 14px 14px 14px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
      <button aria-label="Previous month" style="width: 44px; height: 36px; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-start; cursor: pointer; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1B3B2D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </button>
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">October 2026</h2>
      <button aria-label="Next month" style="width: 44px; height: 36px; border: 0; background: transparent; display: flex; align-items: center; justify-content: flex-end; cursor: pointer; padding: 0" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C3CCC5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>
    <div aria-hidden="true" style="margin-top: 8px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{dow}}" as="d" hint-placeholder-count="7">
        <span style="text-align: center; font-size: 11px; font-weight: 700; color: #56655C; letter-spacing: 0.04em">{{d}}</span>
      </sc-for>
    </div>
    <div style="margin-top: 6px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <div style="height: 42px; display: flex; align-items: center; justify-content: center">
          <div style="width: 38px; height: 38px; border-radius: 19px; background: {{d.fill}}; border: {{d.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font: {{d.weight}} 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{d.ink}}">{{d.n}}</div>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 12px; color: #56655C">
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #1EB955"></span>All goals</span>
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; background: #CDEFD8"></span>Some</span>
      <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 5px; border: 1.5px solid #1B3B2D; box-sizing: border-box"></span>Today</span>
    </div>
  </section>

  <h2 style="margin: 20px 20px 8px 20px; font-size: 17px; font-weight: 700">Recent days</h2>
  <div style="margin: 0 16px; border-radius: 22px; background: #FFFFFF; overflow: hidden">
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
      <a href="HistoryDay.dc.html" style="min-height: 60px; padding: 0 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #0E1A13; border-bottom: 1px solid #EEF1EC">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 16px; font-weight: 600">{{r.date}}</span>
          <div aria-hidden="true" style="display: flex; gap: 4px">
            <sc-for list="{{r.dots}}" as="dot" hint-placeholder-count="6">
              <span style="width: 8px; height: 8px; border-radius: 4px; background: {{dot}}"></span>
            </sc-for>
          </div>
        </div>
        <span style="font: 700 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{r.color}}">{{r.score}}</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9AA69F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Tabs" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: rgba(255,255,255,0.72); border: 1px solid rgba(14,26,19,0.08); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: 0 12px 32px -12px rgba(14,26,19,0.35)">
    <a href="Main.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: #56655C; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 8a4 4 0 1 0 4 4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Today</span>
    </a>
    <a href="Nutrients.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: #56655C; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10.5 11 5 20 4c0 9-5.5 15-14 15zM5 19l7-7"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Nutrients</span>
    </a>
    <a href="History.dc.html" style="width: 92px; height: 54px; border-radius: 28px; background: rgba(27,59,45,0.10); color: #1B3B2D; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v15H4zM4 10h16M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">History</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var days = [];
    for (var b = 0; b < 3; b++) days.push({ n: '', fill: 'transparent', border: '0', ink: 'transparent', weight: 400 });
    for (var d = 1; d <= 31; d++) {
      var cell = { n: String(d), fill: 'transparent', border: '0', ink: '#9AA69F', weight: 500 };
      if (d === 1) { cell.fill = '#CDEFD8'; cell.ink = '#0E1A13'; cell.weight = 600; }
      else if (d <= 11) { cell.fill = '#1EB955'; cell.ink = '#0E1A13'; cell.weight = 700; }
      else if (d === 12) { cell.fill = '#CDEFD8'; cell.border = '2px solid #1B3B2D'; cell.ink = '#0E1A13'; cell.weight = 700; }
      days.push(cell);
    }
    var t = ['#E5A500', '#13A39C', '#6B5BE0', '#2F80ED', '#E2674A', '#9B6A45'];
    var off = '#E3E8E1';
    return {
      dow: ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'],
      days: days,
      recent: [
        { date: 'Sunday, 11 October', dots: t, score: '6/6', color: '#137A3A' },
        { date: 'Saturday, 10 October', dots: t, score: '6/6', color: '#137A3A' },
        { date: 'Thursday, 1 October', dots: [t[0], off, t[2], t[3], off, t[5]], score: '4/6', color: '#56655C' }
      ]
    };
  }
}
</script>
</body>
</html>
