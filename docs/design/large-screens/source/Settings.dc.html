<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Settings in the readable column</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{W}}px; height: {{H}}px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <sc-if value="{{topBar}}" hint-placeholder-val="{{true}}">
    <button style="position: absolute; top: 24px; right: {{doneRight}}px; height: 44px; padding: 0 18px; border-radius: 22px; border: 1px solid {{c.glassBorder}}; background: {{c.glass}}; font: 600 16px -apple-system, system-ui, sans-serif; color: {{c.link}}">Done</button>
  </sc-if>
  <sc-if value="{{sideBar}}" hint-placeholder-val="{{false}}">
    <div role="toolbar" aria-label="Settings" style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 48px; box-sizing: border-box; padding: 4px; border-radius: 24px; background: {{c.glass}}; border: 1px solid {{c.glassBorder}}; box-shadow: 0 10px 28px -14px rgba(14,26,19,0.35)">
      <button aria-label="Done" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: {{c.btn}}; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.btnInk}}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </button>
    </div>
  </sc-if>

  <main style="position: absolute; left: {{CX}}px; width: {{CW}}px; top: {{top}}px; display: flex; flex-direction: column">
    <h1 style="margin: 0 4px; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">Settings</h1>

    <button style="margin-top: 16px; width: 100%; border: 0; text-align: left; padding: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: flex; align-items: center; gap: 14px; font-family: inherit; color: {{c.ink}}">
      <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 28px; background: #1B3B2D; color: #7BE3A0; display: flex; align-items: center; justify-content: center; font: 700 24px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">A</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 18px; font-weight: 700">Alex</span>
        <span style="font-size: 14px; color: {{c.ink2}}">Edit profile</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <div style="margin-top: 20px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; overflow: hidden">
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
          <button style="width: 100%; min-height: 56px; border: 0; border-bottom: {{r.sep}}; background: transparent; padding: 0 14px; display: flex; align-items: center; gap: 12px; font: 400 16px -apple-system, system-ui, sans-serif; color: {{c.ink}}; text-align: left">
            <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 9px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"></path></svg>
            </span>
            <span style="flex: 1">{{r.label}}</span>
            <span style="color: {{c.ink2}}; font-size: 15px">{{r.value}}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </sc-for>
      </div>
    </sc-for>

    <div style="margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: {{c.ink2}}; max-width: 300px">Private by design. No accounts, no servers, no tracking. Your data lives on your devices and your iCloud.</p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"dev":{"editor":"enum","options":["ipad","duoIn"],"default":"ipad"},"w":{"editor":"int","default":1376},"h":{"editor":"int","default":1032},"$preview":{"width":1376,"height":1032}}'>
class Component extends DCLogic {
  renderVals() {
    var P = this.props;
    var W = Number(P.w ?? 1376), H = Number(P.h ?? 1032), dev = String(P.dev ?? 'ipad'), D = !!P.dark;
    var c = D ? { bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chev: '#5F7268', line: '#22332A', link: '#5BD88A', btn: '#1EB955', btnInk: '#0A130E',
                  shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', glass: 'rgba(28,42,34,0.8)', glassBorder: 'rgba(255,255,255,0.08)' }
              : { bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chev: '#9AA69F', line: '#EEF1EC', link: '#1B3B2D', btn: '#1B3B2D', btnInk: '#FFFFFF',
                  shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', glass: 'rgba(255,255,255,0.8)', glassBorder: 'rgba(14,26,19,0.08)' };
    var left, right, top;
    if (dev === 'duoIn') { left = 20; right = 84; top = 28; }
    else { var m = W >= 1000 ? 40 : 24; left = m; right = m; top = 92; }
    var avail = W - left - right, CW = Math.min(640, avail), CX = left + (avail - CW) / 2;
    var sep = '1px solid ' + c.line;
    function r(label, value, bg, icon, last) { return { label: label, value: value, bg: bg, icon: icon, sep: last ? '0' : sep }; }
    return {
      W: W, H: H, c: c, CX: CX, CW: CW, top: top, doneRight: right, topBar: dev === 'ipad', sideBar: dev !== 'ipad',
      sections: [
        { rows: [
          r('iCloud Sync', 'On', '#2F80ED', 'M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z'),
          r('Notifications', 'Noon check-in', '#D2563A', 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0'),
          r('Streaks', 'On', '#1B8A47', 'M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z'),
          r('Groups', '2', '#6B5BE0', 'M3 7h6l2 2h10v10H3z', true) ] },
        { rows: [
          r('Rate nutrx', '', '#C48C00', 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z'),
          r('About', '', '#56655C', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 8v.01', true) ] }
      ]
    };
  }
}
</script>
</body>
</html>
