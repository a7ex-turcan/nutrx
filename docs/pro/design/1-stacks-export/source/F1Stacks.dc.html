<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Settings, Stacks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.scrim}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <section aria-label="Stacks" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: {{c.bg}}; border-radius: 38px 38px 0 0; padding: 8px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{c.grabber}}"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
      <a href="F2Settings.dc.html" style="height: 44px; padding: 0 14px 0 8px; border-radius: 22px; background: {{c.card}}; display: flex; align-items: center; gap: 2px; text-decoration: none; color: {{c.ink}}; font-size: 16px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        Settings
      </a>
      <div style="display: flex; gap: 8px">
        <sc-if value="{{hasStacks}}" hint-placeholder-val="{{true}}">
          <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.card}}; color: {{c.ink}}; font: 600 16px -apple-system, system-ui, sans-serif">Edit</button>
        </sc-if>
        <a href="F1StackDetail.dc.html" aria-label="New stack" style="width: 44px; height: 44px; border-radius: 22px; background: {{c.btn}}; display: flex; align-items: center; justify-content: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.btnInk}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </a>
      </div>
    </div>
    <h1 style="margin: 12px 4px 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Stacks</h1>

    <sc-if value="{{hasStacks}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 16px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; overflow: hidden">
        <sc-for list="{{stacks}}" as="s" hint-placeholder-count="3">
          <a href="F1StackDetail.dc.html" style="min-height: 72px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{c.ink}}; border-bottom: {{s.sep}}">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <span style="font-size: 16px; font-weight: 600">{{s.title}}</span>
              <span style="display: flex; align-items: center; gap: 5px">
                <sc-for list="{{s.icons}}" as="ic" hint-placeholder-count="3">
                  <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 7px; background: {{ic.tile}}; display: flex; align-items: center; justify-content: center">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ic.tint}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.d}}"></path></svg>
                  </span>
                </sc-for>
                <span style="font-size: 13px; color: {{c.ink2}}; margin-left: 3px">{{s.summary}}</span>
              </span>
            </span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </a>
        </sc-for>
      </div>
      <p style="margin: 10px 4px 0 4px; font-size: 13px; line-height: 18px; color: {{c.ink2}}">Stacks appear on Today in this order. Swipe a stack to delete it.</p>
    </sc-if>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 0 24px 120px 24px">
        <span aria-hidden="true" style="width: 76px; height: 76px; border-radius: 24px; background: {{c.tile}}; display: flex; align-items: center; justify-content: center">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="{{c.tileInk}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5"></path></svg>
        </span>
        <h2 style="margin: 6px 0 0 0; font-size: 22px; font-weight: 700">No stacks yet</h2>
        <p style="margin: 0; font-size: 15px; line-height: 21px; color: {{c.ink2}}">A stack logs several nutrients in one tap — everything you take with breakfast, for example.</p>
        <a href="F1StackDetail.dc.html" style="margin-top: 10px; height: 50px; padding: 0 22px; border-radius: 16px; background: {{c.btn}}; color: {{c.btnInk}}; text-decoration: none; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Create a stack
        </a>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"empty":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, E = !!this.props.empty;
    var c = D ? {
      scrim: '#050A07', bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)',
      btn: '#1EB955', btnInk: '#0A130E', grabber: '#2C4035', line: '#22332A', chev: '#5F7268', tile: 'rgba(30,185,85,0.16)', tileInk: '#5BD88A', tileA: '33'
    } : {
      scrim: '#2A3A31', bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)',
      btn: '#1B3B2D', btnInk: '#FFFFFF', grabber: '#CBD3CA', line: '#EEF1EC', chev: '#9AA69F', tile: '#DCE7DF', tileInk: '#1B3B2D', tileA: '2E'
    };
    var I = {
      sun: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      fish: 'M2.5 12c2.8-3.6 7.5-5 11.5-3.2L18.5 6v12L14 15.2C10 17 5.3 15.6 2.5 12z',
      pill: 'M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7zM7 7l7 7',
      moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
      leaf: 'M5 19C5 10.5 11 5 20 4c0 9-5.5 15-14 15zM5 19l7-7'
    };
    function ic(k, t) { return { d: I[k], tint: t, tile: t + c.tileA }; }
    var stacks = [
      { title: 'Morning', summary: 'Vitamin D, Omega-3, Magnesium', icons: [ic('sun', '#E5A500'), ic('fish', '#13A39C'), ic('pill', '#6B5BE0')] },
      { title: 'With dinner', summary: 'Iron, Omega-3', icons: [ic('leaf', '#1EB955'), ic('fish', '#13A39C')] },
      { title: 'Before bed', summary: 'Melatonin, Magnesium', icons: [ic('moon', '#2F80ED'), ic('pill', '#6B5BE0')] }
    ];
    stacks.forEach(function (s, i) { s.sep = i === stacks.length - 1 ? '0' : '1px solid ' + c.line; });
    return { c: c, stacks: stacks, hasStacks: !E, empty: E };
  }
}
</script>
</body>
</html>
