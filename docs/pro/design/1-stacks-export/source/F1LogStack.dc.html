<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Log a stack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.scrim}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div aria-hidden="true" style="position: absolute; left: 14px; right: 14px; top: 48px; height: 60px; border-radius: 30px 30px 0 0; background: {{c.peek}}"></div>

  <section aria-label="Log Morning stack" style="position: absolute; left: 0; right: 0; top: 330px; bottom: 0; background: {{c.bg}}; border-radius: 38px 38px 0 0; padding: 8px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{c.grabber}}"></div>

    <div style="display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 0 4px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Morning</h1>
        <span style="font-size: 14px; color: {{c.ink2}}">{{subtitle}}</span>
      </div>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.chip}}; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <div style="margin-top: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; border-bottom: {{r.sep}}">
          <div style="position: relative; width: 44px; height: 44px; flex: none">
            <svg width="44" height="44" viewBox="0 0 52 52" aria-hidden="true">
              <circle cx="26" cy="26" r="22" fill="none" stroke="{{r.track}}" stroke-width="5"></circle>
              <circle cx="26" cy="26" r="22" fill="none" stroke="{{r.tint}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{r.dash}}" transform="rotate(-90 26 26)"></circle>
            </svg>
            <svg style="position: absolute; left: 12px; top: 12px" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{r.tint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
            <sc-if value="{{r.done}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 9px; background: #1EB955; border: 2px solid {{c.card}}; display: flex; align-items: center; justify-content: center">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
              </div>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 16px; font-weight: 600">{{r.title}}</span>
            <span style="font-size: 13px; color: {{c.ink2}}">{{r.after}}</span>
          </div>
          <sc-if value="{{editable}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; align-items: center; gap: 2px; border-radius: 22px; background: {{c.chip}}">
              <button aria-label="Less {{r.title}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
              </button>
              <span style="min-width: 64px; text-align: center; font: 700 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{r.amount}}</span>
              <button aria-label="More {{r.title}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
            </div>
          </sc-if>
          <sc-if value="{{logged}}" hint-placeholder-val="{{false}}">
            <span style="font: 700 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.greenInk}}">+{{r.amount}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <sc-if value="{{editable}}" hint-placeholder-val="{{true}}">
      <p style="margin: 10px 4px 0 4px; font-size: 13px; line-height: 18px; color: {{c.ink2}}">Changes here apply to this time only. <a href="F1StackDetail.dc.html" style="color: {{c.linkInk}}; font-weight: 600; text-decoration: none">Edit stack</a></p>
      <button style="margin-top: 16px; height: 56px; border-radius: 18px; border: 0; background: {{c.btn}}; color: {{c.btnInk}}; font: 600 17px -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Log 3 nutrients
      </button>
    </sc-if>

    <sc-if value="{{logged}}" hint-placeholder-val="{{false}}">
      <div role="status" style="margin-top: 14px; padding: 12px 14px; border-radius: 18px; background: {{c.successBg}}; display: flex; align-items: center; gap: 10px">
        <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #1EB955; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
        </span>
        <span style="font-size: 15px; font-weight: 600; color: {{c.greenInk}}">Logged 3 nutrients at 08:12</span>
      </div>
      <div style="margin-top: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <button style="height: 56px; border-radius: 18px; border: 1.5px solid {{c.ghost}}; background: transparent; color: {{c.ink}}; font: 600 17px -apple-system, system-ui, sans-serif">Undo</button>
        <button style="height: 56px; border-radius: 18px; border: 0; background: {{c.btn}}; color: {{c.btnInk}}; font: 600 17px -apple-system, system-ui, sans-serif">Done</button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"logged":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, L = !!this.props.logged;
    var c = D ? {
      scrim: '#050A07', peek: 'rgba(255,255,255,0.08)', bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chip: 'rgba(255,255,255,0.07)',
      shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', ghost: '#2C4035', btn: '#1EB955', btnInk: '#0A130E', linkInk: '#5BD88A', greenInk: '#5BD88A',
      grabber: '#2C4035', line: '#22332A', successBg: 'rgba(30,185,85,0.14)'
    } : {
      scrim: '#2A3A31', peek: 'rgba(201,209,200,0.55)', bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chip: 'rgba(14,26,19,0.06)',
      shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', ghost: '#D5DCD3', btn: '#1B3B2D', btnInk: '#FFFFFF', linkInk: '#1B3B2D', greenInk: '#137A3A',
      grabber: '#CBD3CA', line: '#EEF1EC', successBg: '#E3F5E9'
    };
    var C = 138.23;
    var I = {
      sun: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      fish: 'M2.5 12c2.8-3.6 7.5-5 11.5-3.2L18.5 6v12L14 15.2C10 17 5.3 15.6 2.5 12z',
      pill: 'M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7zM7 7l7 7'
    };
    function r(title, icon, tint, before, after, amount, unitAfter, last) {
      var f = L ? after : before;
      return { title: title, icon: I[icon], tint: tint, track: tint + (D ? '33' : '26'), dash: (Math.min(f, 1) * C).toFixed(1) + ' ' + C,
        amount: amount, after: unitAfter, done: L && after >= 1, sep: last ? '0' : '1px solid ' + c.line };
    }
    var rows = [
      r('Vitamin D', 'sun', '#E5A500', 0, 0.5, '2,000 IU', L ? '2,000 / 4,000 IU' : '0 / 4,000 IU'),
      r('Omega-3', 'fish', '#13A39C', 0, 0.5, '1,000 mg', L ? '1,000 / 2,000 mg' : '0 / 2,000 mg'),
      r('Magnesium', 'pill', '#6B5BE0', 0, 1, '400 mg', L ? '400 / 400 mg · Done' : '0 / 400 mg', true)
    ];
    return { c: c, rows: rows, editable: !L, logged: L, subtitle: L ? 'Logged today' : '3 nutrients · amounts for this time' };
  }
}
</script>
</body>
</html>
