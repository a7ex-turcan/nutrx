<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — analytics with supply</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="padding: 54px 12px 0 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="height: 44px; padding: 0 14px 0 8px; border-radius: 22px; background: {{c.glass}}; display: flex; align-items: center; gap: 2px; text-decoration: none; color: {{c.ink}}; font-size: 16px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Nutrients
    </a>
    <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.glass}}; font: 600 16px -apple-system, system-ui, sans-serif; color: {{c.ink}}">Edit</button>
  </div>
  <div style="padding: 14px 20px 0 20px; display: flex; align-items: center; gap: 14px">
    <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: {{c.sunTile}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{c.sunInk}}" stroke-width="2" stroke-linecap="round"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Vitamin D</h1>
      <div style="font-size: 14px; color: {{c.ink2}}">At least 4,000 IU a day</div>
    </div>
  </div>

  <section style="margin: 18px 16px 0 16px; padding: 18px; border-radius: 24px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">Hit rate</span><span style="font: 700 26px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">83<span style="font-size: 16px; color: {{c.ink2}}">%</span></span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">Daily avg</span><span style="font: 700 26px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">3,830</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">Best day</span><span style="font: 700 26px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">5,000</span></div>
  </section>

  <section aria-label="Supply" style="margin: 12px 16px 0 16px; padding: 18px; border-radius: 24px; background: {{c.card}}; box-shadow: {{focusShadow}}; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Supply</h2>
      <button style="height: 32px; padding: 0; border: 0; background: transparent; font: 600 15px -apple-system, system-ui, sans-serif; color: {{c.linkInk}}">Edit</button>
    </div>
    <div style="display: flex; align-items: baseline; gap: 6px">
      <span style="font: 700 34px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.amberInk}}">6</span>
      <span style="font-size: 17px; font-weight: 600; color: {{c.amberInk}}">days left</span>
      <span style="flex: 1"></span>
      <span style="font-size: 13px; color: {{c.ink2}}"><span style="font: 700 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink}}">12</span> of 120 softgels</span>
    </div>
    <div role="img" aria-label="12 of 120 servings left" style="position: relative; height: 12px; border-radius: 6px; background: {{c.chip}}">
      <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 10%; border-radius: 6px; background: #E08A1E"></span>
      <span aria-hidden="true" style="position: absolute; left: 11.7%; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: {{c.ink2}}"></span>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: {{c.ink2}}">At your usual <span style="font: 700 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink}}">2,000 IU</span> a day. Reminder at 7 days left. Last refilled 16 August.</p>
    <button style="height: 50px; border-radius: 16px; border: {{refillBorder}}; background: {{refillBg}}; color: {{refillInk}}; font: 600 16px -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>
      Refilled
    </button>
  </section>

  <section style="margin: 12px 16px 0 16px; padding: 18px; border-radius: 24px; background: {{c.card}}; box-shadow: {{c.shadow}}; opacity: 0.9">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700">Last 7 days</h2>
    <div aria-hidden="true" style="margin-top: 14px; height: 90px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end">
      <span style="height: 60px; border-radius: 8px; background: #E5A500"></span>
      <span style="height: 60px; border-radius: 8px; background: #E5A500"></span>
      <span style="height: 30px; border-radius: 8px; background: {{c.sunSoft}}"></span>
      <span style="height: 75px; border-radius: 8px; background: #E5A500"></span>
      <span style="height: 60px; border-radius: 8px; background: #E5A500"></span>
      <span style="height: 60px; border-radius: 8px; background: #E5A500"></span>
      <span style="height: 30px; border-radius: 8px; border: 2px dashed #E5A500; box-sizing: border-box"></span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"focus":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, F = !!this.props.focus;
    var c = D ? { bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chip: 'rgba(255,255,255,0.08)', shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', glass: 'rgba(28,42,34,0.8)', linkInk: '#5BD88A', amberInk: '#F0B35A', btn: '#1EB955', btnInk: '#0A130E', ghost: '#2C4035', sunTile: 'rgba(229,165,0,0.2)', sunInk: '#E5A500', sunSoft: 'rgba(229,165,0,0.35)' }
              : { bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chip: 'rgba(14,26,19,0.07)', shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', glass: 'rgba(255,255,255,0.8)', linkInk: '#1B3B2D', amberInk: '#9A5A0C', btn: '#1B3B2D', btnInk: '#FFFFFF', ghost: '#D5DCD3', sunTile: '#FCF1D2', sunInk: '#B07E00', sunSoft: '#F5DFA0' };
    return { c: c,
      focusShadow: F ? '0 0 0 3px ' + (D ? '#1EB955' : '#1B3B2D') : c.shadow,
      refillBg: F ? c.btn : 'transparent', refillInk: F ? c.btnInk : c.ink, refillBorder: F ? '0' : '1.5px solid ' + c.ghost };
  }
}
</script>
</body>
</html>
