<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — medium widget, running low</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 520px; box-sizing: border-box; padding: 24px 14px; background: #DDE3DA; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 14px">
  <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
      <div style="width: 364px; height: 170px; border-radius: 26px; background: {{m.bg}}; color: {{m.ink}}; box-sizing: border-box; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 14px 30px -16px rgba(14,26,19,0.35)">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 10px; height: 40px">
            <svg width="32" height="32" viewBox="0 0 52 52" aria-hidden="true" style="flex: none">
              <circle cx="26" cy="26" r="22" fill="none" stroke="{{r.track}}" stroke-width="6"></circle>
              <circle cx="26" cy="26" r="22" fill="none" stroke="{{r.tint}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{r.dash}}" transform="rotate(-90 26 26)"></circle>
            </svg>
            <span style="flex: 1; display: flex; flex-direction: column">
              <span style="font-size: 14px; font-weight: 600">{{r.title}}</span>
              <span style="font: 600 12px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{m.ink2}}">{{r.val}}</span>
            </span>
            <button aria-label="Log {{r.title}}" style="width: 44px; height: 34px; border-radius: 17px; border: 0; background: {{m.btn}}; display: flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{m.btnInk}}" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </sc-for>
        <div style="display: flex; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px solid {{m.line}}; font-size: 12px; font-weight: 600">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{m.amber}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M8 3v3l-2 3v11a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V9l-2-3V3"></path></svg>
          <span style="color: {{m.amber}}">Running low:</span>
          <span>Vitamin D · <span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">6</span> days</span>
        </div>
      </div>
      <figcaption style="font-size: 13px; color: #56655C">{{m.caption}}</figcaption>
    </figure>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    var C = 138.23;
    function r(title, tint, frac, val) { return { title: title, tint: tint, track: tint + '30', dash: (frac * C).toFixed(1) + ' ' + C, val: val }; }
    return {
      modes: [
        { caption: 'Light', bg: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', btn: '#1B3B2D', btnInk: '#FFFFFF', line: '#EEF1EC', amber: '#9A5A0C' },
        { caption: 'Dark', bg: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', btn: '#1EB955', btnInk: '#0A130E', line: '#22332A', amber: '#F0B35A' }
      ],
      rows: [ r('Vitamin D', '#E5A500', 0.5, '2,000 / 4,000 IU'), r('Water', '#2F80ED', 0.6, '1.5 / 2.5 L') ]
    };
  }
}
</script>
</body>
</html>
