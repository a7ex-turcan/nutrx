<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — notification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.wall}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 120px 12px 0 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
  <svg aria-hidden="true" width="520" height="520" viewBox="0 0 520 520" style="position: absolute; left: -160px; bottom: -140px">
    <circle cx="260" cy="260" r="200" fill="none" stroke="{{c.ring1}}" stroke-width="70"></circle>
    <circle cx="260" cy="260" r="200" fill="none" stroke="{{c.ring2}}" stroke-width="70" stroke-linecap="round" stroke-dasharray="700 1257" transform="rotate(-90 260 260)"></circle>
  </svg>

  <span style="position: relative; margin: 0 8px; font-size: 13px; font-weight: 600; color: {{c.caption}}">Banner</span>
  <div style="position: relative; padding: 14px; border-radius: 24px; background: {{c.glass}}; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; gap: 12px; align-items: flex-start">
    <span aria-hidden="true" style="width: 38px; height: 38px; border-radius: 9px; background: #1B3B2D; display: flex; align-items: flex-end; justify-content: center; position: relative; flex: none; overflow: hidden">
      <span style="font: 800 30px/0.9 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #1EB955; margin-right: 8px">n</span>
      <span style="position: absolute; right: 5px; top: 7px; width: 10px; height: 10px; border-radius: 5px; background: #1EB955"></span>
    </span>
    <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
      <span style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{title}}</span><span style="font-size: 13px; color: {{c.ink2}}">now</span></span>
      <span style="font-size: 15px; line-height: 20px">{{body}}</span>
    </span>
  </div>

  <span style="position: relative; margin: 18px 8px 0 8px; font-size: 13px; font-weight: 600; color: {{c.caption}}">Long press</span>
  <div style="position: relative; padding: 14px; border-radius: 24px; background: {{c.glass}}; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; flex-direction: column; gap: 12px">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{c.ink2}}">NUTRX</span>
    <span style="font-size: 17px; font-weight: 600">{{title}}</span>
    <span style="font-size: 15px; line-height: 20px">{{body}}</span>
  </div>
  <div style="position: relative; border-radius: 18px; background: {{c.glass}}; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); overflow: hidden; width: 250px">
    <sc-for list="{{actions}}" as="a" hint-placeholder-count="2">
      <a href="{{a.href}}" style="min-height: 48px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: {{c.ink}}; font-size: 16px; border-bottom: {{a.sep}}">
        <span>{{a.label}}</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"kind":{"editor":"enum","options":["refill","recap"],"default":"refill"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, K = this.props.kind ?? 'refill';
    var c = D ? { wall: '#0C1611', ring1: 'rgba(255,255,255,0.03)', ring2: 'rgba(30,185,85,0.18)', glass: 'rgba(40,52,45,0.72)', ink: '#F2F6F3', ink2: '#A9B8AE', caption: '#A9B8AE', line: 'rgba(255,255,255,0.1)' }
              : { wall: '#C7D4CA', ring1: 'rgba(255,255,255,0.18)', ring2: 'rgba(27,59,45,0.22)', glass: 'rgba(255,255,255,0.7)', ink: '#0E1A13', ink2: '#56655C', caption: '#2E4036', line: 'rgba(14,26,19,0.1)' };
    var refill = K === 'refill';
    var actions = refill ? [
      { label: 'Refilled', href: 'F3AnalyticsOpen.dc.html', d: 'M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7' },
      { label: 'Remind me tomorrow', href: '#', d: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2' }
    ] : [
      { label: 'Open recap', href: 'F5Recap.dc.html', d: 'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4' },
      { label: 'Turn off weekly recaps', href: '#', d: 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0M3 3l18 18' }
    ];
    actions.forEach(function (a, i) { a.sep = i === actions.length - 1 ? '0' : '1px solid ' + c.line; });
    return { c: c, actions: actions,
      title: refill ? 'Vitamin D runs out in about a week' : 'Your week in nutrx',
      body: refill ? 'About 6 days left at your usual amount. Tap Refilled when you open a new bottle.' : 'You hit 31 of 42 goals. Vitamin D was your steadiest.' };
  }
}
</script>
</body>
</html>
