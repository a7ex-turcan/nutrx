<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — Supply sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.scrim}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <section aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: {{c.bg}}; border-radius: 38px 38px 0 0; padding: 16px 16px 0 16px; box-sizing: border-box; opacity: 0.55">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="height: 44px; padding: 0 14px; border-radius: 22px; background: {{c.card}}; display: flex; align-items: center; font-size: 16px">Cancel</span>
      <span style="font-size: 17px; font-weight: 700">Edit Nutrient</span>
      <span style="height: 44px; padding: 0 18px; border-radius: 22px; background: {{c.btn}}; color: {{c.btnInk}}; display: flex; align-items: center; font-size: 16px; font-weight: 600">Save</span>
    </div>
    <div style="margin-top: 14px; border-radius: 20px; background: {{c.card}}; overflow: hidden">
      <div style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid {{c.line}}"><span style="flex: 1">Group</span><span style="color: {{c.ink2}}">Vitamins &amp; minerals</span></div>
      <div style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid {{c.line}}"><span style="flex: 1">Reminders</span><span style="color: {{c.ink2}}">13:00</span></div>
      <div style="min-height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 1">Supply</span><span style="color: {{c.ink2}}">Not set</span></div>
    </div>
  </section>

  <section aria-label="Supply for Vitamin D" style="position: absolute; left: 0; right: 0; top: 250px; bottom: 0; background: {{c.bg}}; border-radius: 38px 38px 0 0; padding: 8px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,0.18)">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{c.grabber}}"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
      <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: {{c.card}}; font: 400 16px -apple-system, system-ui, sans-serif; color: {{c.ink}}">Cancel</button>
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">Supply</h1>
      <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: {{c.btn}}; font: 600 16px -apple-system, system-ui, sans-serif; color: {{c.btnInk}}">Save</button>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 0 4px">
      <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: {{c.sunTile}}; display: flex; align-items: center; justify-content: center">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{c.sunInk}}" stroke-width="2" stroke-linecap="round"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </span>
      <span style="font-size: 16px; font-weight: 600">Vitamin D</span>
    </div>

    <div style="margin-top: 12px; border-radius: 20px; background: {{c.card}}; overflow: hidden">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="3">
        <div style="min-height: 64px; padding: 8px 8px 8px 14px; display: flex; align-items: center; gap: 10px; border-bottom: {{f.sep}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
            <label for="{{f.id}}" style="font-size: 16px">{{f.label}}</label>
            <span style="font-size: 12px; color: {{c.ink2}}">{{f.hint}}</span>
          </span>
          <div style="display: flex; align-items: center; border-radius: 22px; background: {{c.chip}}">
            <button aria-label="Decrease" style="width: 40px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <input id="{{f.id}}" value="{{f.value}}" inputmode="decimal" style="width: 74px; border: 0; background: transparent; text-align: center; font: 700 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink}}; padding: 0; outline: none">
            <button aria-label="Increase" style="width: 40px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>

    <p style="margin: 12px 4px 0 4px; font-size: 14px; line-height: 20px; color: {{c.ink2}}">That's <span style="font: 700 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink}}">120,000 IU</span> — about 60 days at your usual 2,000 IU a day.</p>

    <button style="margin-top: 16px; height: 52px; border-radius: 18px; border: 1.5px solid {{c.ghost}}; background: transparent; color: {{c.ink}}; font: 600 16px -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"></path></svg>
      Refilled today
    </button>
    <p style="margin: 8px 4px 0 4px; font-size: 13px; line-height: 18px; color: {{c.ink2}}; text-align: center">Starts the count again from a full bottle.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark;
    var c = D ? { scrim: '#050A07', bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chip: 'rgba(255,255,255,0.07)', grabber: '#2C4035', line: '#22332A', btn: '#1EB955', btnInk: '#0A130E', ghost: '#2C4035', sunTile: 'rgba(229,165,0,0.2)', sunInk: '#E5A500' }
              : { scrim: '#2A3A31', bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chip: 'rgba(14,26,19,0.06)', grabber: '#CBD3CA', line: '#EEF1EC', btn: '#1B3B2D', btnInk: '#FFFFFF', ghost: '#D5DCD3', sunTile: '#FCF1D2', sunInk: '#B07E00' };
    var fields = [
      { id: 'sv', label: 'Servings in the bottle', hint: 'Softgels, tablets, scoops…', value: '120' },
      { id: 'es', label: 'Each serving', hint: 'Same as “each tap adds”', value: '1,000 IU' },
      { id: 'rd', label: 'Remind me', hint: 'When this many days are left', value: '7 days' }
    ];
    fields.forEach(function (f, i) { f.sep = i === 2 ? '0' : '1px solid ' + c.line; });
    return { c: c, fields: fields };
  }
}
</script>
</body>
</html>
