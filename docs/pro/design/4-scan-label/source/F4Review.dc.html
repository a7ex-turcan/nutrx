<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — review a scanned label</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
input::placeholder{color:#8A968F}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.scrim}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <section aria-label="New nutrient from label" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: {{c.bg}}; border-radius: 38px 38px 0 0; padding: 8px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{c.grabber}}"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
      <button style="height: 44px; padding: 0 14px; border-radius: 22px; border: 0; background: {{c.card}}; font: 400 16px -apple-system, system-ui, sans-serif; color: {{c.ink}}">Cancel</button>
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">New Nutrient</h1>
      <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: {{c.btnOff}}; font: 600 16px -apple-system, system-ui, sans-serif; color: {{c.btnOffInk}}" disabled>Add</button>
    </div>

    <div style="margin-top: 14px; padding: 12px 14px; border-radius: 18px; background: {{c.infoBg}}; display: flex; align-items: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.infoInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 10h8M8 14h5"></path></svg>
      <span style="flex: 1; font-size: 14px; line-height: 19px">{{banner}}</span>
      <a href="F4Scanner.dc.html" style="font-size: 14px; font-weight: 600; color: {{c.linkInk}}; text-decoration: none; padding: 8px 0 8px 4px">Scan again</a>
    </div>

    <div style="margin-top: 14px; border-radius: 22px; background: {{c.card}}; overflow: hidden">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
        <div style="padding: 10px 14px; border-bottom: {{f.sep}}; display: flex; flex-direction: column; gap: 3px; background: {{f.bg}}">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <label for="{{f.id}}" style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">{{f.label}}</label>
            <sc-if value="{{f.fromLabel}}" hint-placeholder-val="{{true}}">
              <span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: {{c.tagInk}}; background: {{c.tagBg}}; padding: 3px 7px; border-radius: 6px">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path></svg>
                from label
              </span>
            </sc-if>
          </div>
          <input id="{{f.id}}" value="{{f.value}}" placeholder="{{f.placeholder}}" style="border: 0; padding: 0; height: 26px; font: {{f.font}}; color: {{c.ink}}; outline: none; background: transparent">
          <sc-if value="{{f.hint}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; line-height: 16px; color: {{f.hintColor}}">{{f.hint}}</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <h2 style="margin: 18px 4px 8px 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.ink2}}">Daily goal</h2>
    <div style="padding: 10px 14px; border-radius: 22px; background: {{c.card}}; display: flex; flex-direction: column; gap: 3px">
      <label for="goal" style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">At least, per day</label>
      <input id="goal" placeholder="Your amount" style="border: 0; padding: 0; height: 28px; font: 700 20px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink}}; outline: none; background: transparent">
      <span style="font-size: 12px; line-height: 16px; color: {{c.ink2}}">Set the amount you're aiming for. nutrx doesn't suggest one.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"variant":{"editor":"enum","options":["full","partial","noai"],"default":"full"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, V = this.props.variant ?? 'full';
    var c = D ? {
      scrim: '#050A07', bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', grabber: '#2C4035', line: '#22332A', linkInk: '#5BD88A',
      infoBg: 'rgba(19,163,156,0.14)', infoInk: '#13A39C', tagBg: 'rgba(19,163,156,0.18)', tagInk: '#4FD1C9', missBg: 'rgba(224,138,30,0.10)', missInk: '#F0B35A',
      btnOff: 'rgba(255,255,255,0.08)', btnOffInk: '#5F7268'
    } : {
      scrim: '#2A3A31', bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', grabber: '#CBD3CA', line: '#EEF1EC', linkInk: '#1B3B2D',
      infoBg: '#E3F4F3', infoInk: '#0F8A84', tagBg: '#D6F1EF', tagInk: '#0B6E69', missBg: '#FDF3E4', missInk: '#9A5A0C',
      btnOff: 'rgba(14,26,19,0.06)', btnOffInk: '#9AA69F'
    };
    var TEXT = '400 17px -apple-system, system-ui, sans-serif', NUM = '700 17px ui-rounded, \'SF Pro Rounded\', -apple-system, system-ui, sans-serif';
    function f(id, label, value, font, ok, placeholder, missHint) {
      return { id: id, label: label, value: ok ? value : '', font: font, fromLabel: ok, placeholder: placeholder,
        hint: ok ? '' : missHint, hintColor: c.missInk, bg: ok ? 'transparent' : c.missBg };
    }
    var read = {
      full:    { name: true, unit: true, step: true, supply: true },
      partial: { name: true, unit: true, step: true, supply: false },
      noai:    { name: false, unit: true, step: true, supply: false }
    }[V];
    var fields = [
      f('nm', 'Name', 'Vitamin D3', TEXT, read.name, 'e.g. Vitamin D', 'Couldn’t read the name — type it in.'),
      f('un', 'Unit', 'IU', TEXT, read.unit, 'e.g. IU', 'Couldn’t read the unit.'),
      f('st', 'Each tap adds (one serving)', '1,000 IU', NUM, read.step, 'e.g. 1,000', 'Couldn’t read the amount per serving.'),
      f('sp', 'Supply · servings in the bottle', '120 softgels', NUM, read.supply, 'e.g. 120', 'Couldn’t read the bottle size — it’s usually “servings per container”.')
    ];
    fields.forEach(function (x, i) { x.sep = i === fields.length - 1 ? '0' : '1px solid ' + c.line; });
    var banner = V === 'noai' ? 'Filled from the label. Two fields need you.' : (V === 'partial' ? 'Filled from the label. One field needs you.' : 'Filled from the label. Check it before adding.');
    return { c: c, fields: fields, banner: banner };
  }
}
</script>
</body>
</html>
