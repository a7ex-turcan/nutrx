<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — review at the largest text size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 840px; position: relative; overflow: hidden; background: #F2F4EF; color: #0E1A13; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 62px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
  <h1 style="margin: 0 4px; font-size: 40px; line-height: 48px; font-weight: 700">New Nutrient</h1>
  <p style="margin: 0 4px; padding: 14px; border-radius: 18px; background: #E3F4F3; font-size: 24px; line-height: 30px">Filled from the label. Check it before adding.</p>
  <div style="border-radius: 22px; background: #FFFFFF; overflow: hidden">
    <sc-for list="{{fields}}" as="f" hint-placeholder-count="4">
      <div style="padding: 14px 16px; border-bottom: 1px solid #EEF1EC; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 22px; line-height: 28px; font-weight: 600; color: #56655C">{{f.label}}</span>
        <span style="font: {{f.font}}">{{f.value}}</span>
        <span style="align-self: flex-start; font-size: 18px; font-weight: 700; color: #0B6E69; background: #D6F1EF; padding: 4px 10px; border-radius: 8px">from label</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":840}}'>
class Component extends DCLogic {
  renderVals() {
    var T = '400 30px -apple-system, system-ui, sans-serif', N = '700 30px ui-rounded, \'SF Pro Rounded\', -apple-system, system-ui, sans-serif';
    return { fields: [
      { label: 'Name', value: 'Vitamin D3', font: T },
      { label: 'Unit', value: 'IU', font: T },
      { label: 'Each tap adds', value: '1,000 IU', font: N },
      { label: 'Servings in the bottle', value: '120 softgels', font: N }
    ] };
  }
}
</script>
</body>
</html>
