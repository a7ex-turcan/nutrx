<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — trends with Apple Health</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="padding: 54px 12px 0 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="height: 44px; padding: 0 14px 0 8px; border-radius: 22px; background: {{c.glass}}; display: flex; align-items: center; gap: 2px; text-decoration: none; color: {{c.ink}}; font-size: 16px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      Nutrients
    </a>
    <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.glass}}; font: 600 16px -apple-system, system-ui, sans-serif; color: {{c.ink}}">Edit</button>
  </div>
  <div style="padding: 14px 20px 0 20px; display: flex; align-items: center; gap: 14px">
    <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 16px; background: {{c.brownTile}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="{{c.brownInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h1.5a2.5 2.5 0 0 1 0 5H16M8 3.5v2.5M12 3.5v2.5"></path></svg>
    </span>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Caffeine</h1>
      <div style="font-size: 14px; color: {{c.ink2}}">At most 400 mg a day</div>
    </div>
  </div>

  <section aria-label="With Apple Health" style="margin: 18px 16px 0 16px; padding: 18px; border-radius: 24px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2674A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      <h2 style="margin: 0; font-size: 17px; font-weight: 700; flex: 1">With Apple Health</h2>
      <span style="font-size: 12px; color: {{c.ink2}}">Last 28 days</span>
    </div>

    <sc-for list="{{findings}}" as="f" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 10px; padding-top: {{f.pad}}; border-top: {{f.border}}">
        <p style="margin: 0; font-size: 15px; line-height: 21px">{{f.text}}</p>
        <div role="img" aria-label="{{f.aria}}" style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{f.bars}}" as="b" hint-placeholder-count="2">
            <div style="display: grid; grid-template-columns: 96px minmax(0, 1fr) 64px; align-items: center; gap: 8px">
              <span style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">{{b.label}}</span>
              <span style="height: 12px; border-radius: 6px; background: {{c.chip}}; display: block"><span style="display: block; height: 12px; width: {{b.w}}; border-radius: 6px; background: {{b.color}}"></span></span>
              <span style="text-align: right; font: 700 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{b.value}}</span>
            </div>
          </sc-for>
        </div>
        <span style="font-size: 12px; color: {{c.ink2}}">{{f.n}}</span>
      </div>
    </sc-for>
    <p style="margin: 0; font-size: 12px; line-height: 17px; color: {{c.ink2}}">Patterns in your own data, not causes. Worked out on this iPhone.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark;
    var c = D ? { bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chip: 'rgba(255,255,255,0.08)', shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', glass: 'rgba(28,42,34,0.8)', line: '#22332A', brownTile: 'rgba(155,106,69,0.25)', brownInk: '#C49067', soft: 'rgba(155,106,69,0.45)' }
              : { bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chip: 'rgba(14,26,19,0.06)', shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', glass: 'rgba(255,255,255,0.8)', line: '#EEF1EC', brownTile: '#F0E6DE', brownInk: '#7E5536', soft: '#D9C3B1' };
    var findings = [
      { text: 'On days caffeine passes 300 mg, you seem to sleep about 40 minutes less on average.', n: 'Based on 9 days over 300 mg and 19 days under.', aria: 'Sleep 6 hours 35 minutes on high-caffeine days, 7 hours 15 minutes on other days',
        bars: [ { label: 'Over 300 mg', w: '82%', value: '6 h 35', color: '#9B6A45' }, { label: 'Other days', w: '90%', value: '7 h 15', color: c.soft } ], pad: '0', border: '0' },
      { text: 'On days you work out, you log about 80 mg more caffeine on average.', n: 'Based on 12 workout days and 16 rest days.', aria: '290 milligrams on workout days, 210 on rest days',
        bars: [ { label: 'Workout days', w: '72%', value: '290 mg', color: '#9B6A45' }, { label: 'Rest days', w: '52%', value: '210 mg', color: c.soft } ], pad: '16px', border: '1px solid ' + c.line }
    ];
    return { c: c, findings: findings };
  }
}
</script>
</body>
</html>
