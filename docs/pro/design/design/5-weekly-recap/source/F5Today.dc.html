<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — Today with Your week</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="padding: 62px 20px 0 20px; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.ink2}}">Monday, 12 October</div>
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">Today</h1>
    </div>
    <button aria-label="Profile menu" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.avatarBg}}; color: {{c.avatarInk}}; font: 600 17px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">A</button>
  </div>

  <section style="margin: 14px 16px 0 16px; padding: 16px 18px; border-radius: 28px; background: #1B3B2D; display: flex; align-items: center; gap: 18px">
    <div style="position: relative; width: 92px; height: 92px; flex: none">
      <svg width="92" height="92" viewBox="0 0 116 116" aria-hidden="true">
        <sc-for list="{{segments}}" as="s" hint-placeholder-count="6">
          <circle cx="58" cy="58" r="50" fill="none" stroke="{{s.color}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="34.4 279.8" stroke-dashoffset="{{s.offset}}" transform="rotate(-90 58 58)"></circle>
        </sc-for>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font: 700 27px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #FFFFFF">1<span style="color: #9FC2AE">/6</span></div>
        <div style="font-size: 11px; font-weight: 600; color: #B7CCBF; margin-top: 3px">goals met</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 18px; line-height: 23px; font-weight: 700; color: #FFFFFF">5 to go</div>
      <div style="display: flex; align-items: center; gap: 6px; align-self: flex-start; padding: 5px 10px 5px 8px; border-radius: 999px; background: rgba(255,255,255,0.10)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#7BE3A0" aria-hidden="true"><path d="M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z"></path></svg>
        <span style="font: 600 13px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #FFFFFF">10-day streak</span>
      </div>
    </div>
  </section>

  <div style="margin: 10px 16px 0 16px; padding: 12px 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: flex; align-items: center; gap: 12px; color: {{c.ink}}">
    <svg width="44" height="44" viewBox="0 0 52 52" aria-hidden="true" style="flex: none">
      <circle cx="26" cy="26" r="20" fill="none" stroke="{{c.track}}" stroke-width="7"></circle>
      <circle cx="26" cy="26" r="20" fill="none" stroke="#1EB955" stroke-width="7" stroke-linecap="round" stroke-dasharray="93 125.7" transform="rotate(-90 26 26)"></circle>
    </svg>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
      <a href="F5Recap.dc.html" style="font-size: 16px; font-weight: 600; color: {{c.ink}}; text-decoration: none">Your week</a>
      <span style="font-size: 13px; color: {{c.ink2}}"><span style="font: 700 13px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink}}">31</span> of 42 goals · Vitamin D steadiest</span>
    </span>
    <button aria-label="Hide until next week" style="width: 32px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="margin-top: 22px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 20px 10px 20px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Vitamins &amp; minerals</h2>
      <span style="font: 600 13px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink2}}; padding: 4px 8px; border-radius: 999px; background: {{c.chip}}">1/3</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
      <sc-for list="{{cards}}" as="n" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}">
          <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true" style="flex: none">
            <circle cx="26" cy="26" r="22" fill="none" stroke="{{n.track}}" stroke-width="5"></circle>
            <circle cx="26" cy="26" r="22" fill="none" stroke="{{n.tint}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{n.dash}}" transform="rotate(-90 26 26)"></circle>
          </svg>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 16px; font-weight: 600">{{n.title}}</div>
            <div style="display: flex; align-items: baseline; gap: 4px"><span style="font: 700 16px/1.2 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{n.cur}}</span><span style="font-size: 13px; color: {{c.ink2}}">{{n.of}}</span></div>
          </div>
          <button aria-label="Add one step of {{n.title}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.btn}}; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.btnInk}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark;
    var c = D ? { bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chip: 'rgba(255,255,255,0.07)', shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', avatarBg: '#1B3B2D', avatarInk: '#7BE3A0', btn: '#1EB955', btnInk: '#0A130E', track: 'rgba(255,255,255,0.1)' }
              : { bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chip: 'rgba(14,26,19,0.06)', shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', avatarBg: '#DCE7DF', avatarInk: '#1B3B2D', btn: '#1B3B2D', btnInk: '#FFFFFF', track: '#E3E8E1' };
    var C = 138.23;
    function n(title, t, f, cur, of) { return { title: title, tint: t, track: t + (D ? '33' : '26'), dash: (f * C).toFixed(1) + ' ' + C, cur: cur, of: of }; }
    var met = [true, false, false, false, false, false];
    return { c: c, segments: met.map(function (m, i) { return { color: m ? '#1EB955' : 'rgba(255,255,255,0.13)', offset: (-(i * 52.36) - 8.5).toFixed(2) }; }),
      cards: [ n('Vitamin D', '#E5A500', 0.25, '1,000', '/ 4,000 IU'), n('Omega-3', '#13A39C', 1, '2,000', '/ 2,000 mg'), n('Magnesium', '#6B5BE0', 0, '0', '/ 400 mg') ] };
  }
}
</script>
</body>
</html>
