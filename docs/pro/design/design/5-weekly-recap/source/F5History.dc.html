<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — History with weekly recaps</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="padding: 62px 20px 0 20px; display: flex; align-items: flex-end; justify-content: space-between">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">History</h1>
    <div style="display: flex; gap: 8px">
      <a href="{{reportHref}}" aria-label="Report for your doctor" style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: {{c.glass}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"></path></svg>
        <sc-if value="{{free}}" hint-placeholder-val="{{false}}">
          <span style="position: absolute; right: -6px; top: -4px; font: 800 9px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: 0.04em; padding: 3px 4px; border-radius: 5px; background: {{c.badgeSolid}}; color: {{c.badgeSolidInk}}">PRO</span>
        </sc-if>
      </a>
      <button aria-label="Profile menu" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.avatarBg}}; color: {{c.avatarInk}}; font: 600 17px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">A</button>
    </div>
  </div>

  <section style="margin: 16px 16px 0 16px; padding: 18px 20px; border-radius: 24px; background: #1B3B2D; color: #FFFFFF; display: flex; align-items: center; gap: 16px">
    <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 26px; background: rgba(123,227,160,0.16); display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="#7BE3A0"><path d="M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z"></path></svg>
    </span>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
      <span style="font: 700 28px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">10 days</span>
      <span style="font-size: 13px; color: #B7CCBF">Current streak</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.14)">
      <span style="font: 700 22px/1.1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">31</span>
      <span style="font-size: 13px; color: #B7CCBF">Best</span>
    </div>
  </section>

  <a href="{{recapHref}}" style="margin: 12px 16px 0 16px; padding: 12px 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{c.ink}}">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: {{c.indigoTile}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{c.indigoInk}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v15H4zM4 10h16M8 3v4M16 3v4M8 14h4"></path></svg>
    </span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
      <span style="display: flex; align-items: center; gap: 8px">
        <span style="font-size: 16px; font-weight: 600">Weekly recaps</span>
        <sc-if value="{{free}}" hint-placeholder-val="{{false}}">
          <span style="font: 800 10px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: 0.06em; padding: 4px 6px; border-radius: 6px; background: {{c.badgeBg}}; color: {{c.badgeInk}}">PRO</span>
        </sc-if>
      </span>
      <span style="font-size: 13px; color: {{c.ink2}}">{{recapLine}}</span>
    </span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
  </a>

  <section aria-label="October 2026" style="margin: 12px 16px 0 16px; padding: 16px 14px 14px 14px; border-radius: 24px; background: {{c.card}}; box-shadow: {{c.shadow}}">
    <h2 style="margin: 0 0 10px 0; text-align: center; font-size: 17px; font-weight: 700">October 2026</h2>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{days}}" as="d" hint-placeholder-count="35">
        <div style="height: 42px; display: flex; align-items: center; justify-content: center">
          <div style="width: 38px; height: 38px; border-radius: 19px; background: {{d.fill}}; border: {{d.border}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font: 600 14px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{d.ink}}">{{d.n}}</div>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"free":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, F = !!this.props.free;
    var c = D ? { bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chev: '#5F7268', shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', glass: 'rgba(28,42,34,0.8)', avatarBg: '#1B3B2D', avatarInk: '#7BE3A0', indigoTile: 'rgba(107,91,224,0.22)', indigoInk: '#8E81EE', badgeBg: 'rgba(30,185,85,0.16)', badgeInk: '#7BE3A0', badgeSolid: '#1EB955', badgeSolidInk: '#0A130E', partial: 'rgba(30,185,85,0.22)', future: '#5F7268', dayInk: '#EAF2EC', todayRing: '#1EB955' }
              : { bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chev: '#9AA69F', shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', glass: 'rgba(255,255,255,0.8)', avatarBg: '#DCE7DF', avatarInk: '#1B3B2D', indigoTile: '#E6E3FB', indigoInk: '#5A4BCF', badgeBg: 'rgba(27,59,45,0.09)', badgeInk: '#1B3B2D', badgeSolid: '#1B3B2D', badgeSolidInk: '#FFFFFF', partial: '#CDEFD8', future: '#9AA69F', dayInk: '#0E1A13', todayRing: '#1B3B2D' };
    var days = [];
    for (var b = 0; b < 3; b++) days.push({ n: '', fill: 'transparent', border: '0', ink: 'transparent' });
    for (var d = 1; d <= 31; d++) {
      var x = { n: String(d), fill: 'transparent', border: '0', ink: c.future };
      if (d === 1) { x.fill = c.partial; x.ink = c.dayInk; }
      else if (d <= 11) { x.fill = '#1EB955'; x.ink = '#0E1A13'; }
      else if (d === 12) { x.fill = c.partial; x.border = '2px solid ' + c.todayRing; x.ink = c.dayInk; }
      days.push(x);
    }
    return { c: c, days: days, free: F,
      recapLine: F ? 'A short summary of each week' : 'Latest: 5 – 11 October · 31 of 42 goals',
      recapHref: F ? 'F2Paywall.dc.html' : 'F5Recap.dc.html', reportHref: F ? 'F2Paywall.dc.html' : 'F7Create.dc.html' };
  }
}
</script>
</body>
</html>
