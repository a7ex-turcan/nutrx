<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — weekly recap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <div style="padding: 54px 12px 0 8px; display: flex; align-items: center; justify-content: space-between">
    <a href="F5History.dc.html" style="height: 44px; padding: 0 14px 0 8px; border-radius: 22px; background: {{c.glass}}; display: flex; align-items: center; gap: 2px; text-decoration: none; color: {{c.ink}}; font-size: 16px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      History
    </a>
    <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
      <button aria-label="Share recap" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.glass}}; display: flex; align-items: center; justify-content: center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
      </button>
    </sc-if>
  </div>
  <h1 style="margin: 10px 20px 0 20px; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Weekly recap</h1>

  <section style="margin: 14px 16px 0 16px; padding: 18px; border-radius: 28px; background: #1B3B2D; color: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 16px">
      <div style="position: relative; width: 88px; height: 88px; flex: none">
        <svg width="88" height="88" viewBox="0 0 116 116" aria-hidden="true">
          <sc-for list="{{segments}}" as="s" hint-placeholder-count="7">
            <circle cx="58" cy="58" r="50" fill="none" stroke="{{s.color}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="32.9 281.3" stroke-dashoffset="{{s.offset}}" transform="rotate(-90 58 58)"></circle>
          </sc-for>
        </svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <span style="font: 700 24px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{ringValue}}</span>
          <span style="font-size: 10px; font-weight: 600; color: #B7CCBF; margin-top: 3px">{{ringLabel}}</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #9FC2AE">{{range}}</span>
        <span style="font-size: 19px; line-height: 24px; font-weight: 700">{{headline}}</span>
      </div>
    </div>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #DCE9E0">{{summary}}</p>
  </section>

  <sc-if value="{{full}}" hint-placeholder-val="{{true}}">
    <div style="margin: 12px 16px 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{facts}}" as="f" hint-placeholder-count="4">
        <div style="padding: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">{{f.label}}</span>
          <span style="display: flex; align-items: center; gap: 8px">
            <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 9px; background: {{f.tile}}; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{f.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{f.d}}"></path></svg>
            </span>
            <span style="font-size: 16px; font-weight: 600">{{f.value}}</span>
          </span>
          <span style="font-size: 13px; color: {{c.ink2}}">{{f.sub}}</span>
        </div>
      </sc-for>
    </div>

    <h2 style="margin: 18px 20px 8px 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.ink2}}">Earlier weeks</h2>
    <div role="tablist" aria-label="Weeks" style="margin: 0 16px; padding: 10px 8px; border-radius: 22px; background: {{c.card}}; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px">
      <sc-for list="{{weeks}}" as="w" hint-placeholder-count="8">
        <button role="tab" aria-selected="{{w.sel}}" aria-label="{{w.aria}}" style="height: 60px; border: 0; border-radius: 14px; background: {{w.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0">
          <svg width="28" height="28" viewBox="0 0 52 52" aria-hidden="true">
            <circle cx="26" cy="26" r="20" fill="none" stroke="{{c.track}}" stroke-width="7"></circle>
            <circle cx="26" cy="26" r="20" fill="none" stroke="#1EB955" stroke-width="7" stroke-linecap="round" stroke-dasharray="{{w.dash}}" transform="rotate(-90 26 26)"></circle>
          </svg>
          <span style="font: 600 10px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{w.ink}}">{{w.label}}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{first}}" hint-placeholder-val="{{false}}">
    <p style="margin: 14px 20px 0 20px; font-size: 14px; line-height: 20px; color: {{c.ink2}}">Each Sunday evening, nutrx sums up your week from your own logs — what you hit, what slipped and which day. It's written on your iPhone and never leaves it.</p>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"first":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, F = !!this.props.first;
    var c = D ? { bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', glass: 'rgba(28,42,34,0.8)', track: 'rgba(255,255,255,0.1)', selBg: 'rgba(30,185,85,0.14)', tileA: '33' }
              : { bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', glass: 'rgba(255,255,255,0.8)', track: '#E3E8E1', selBg: 'rgba(27,59,45,0.08)', tileA: '2E' };
    var days = F ? [true, true, true, false, false, false, false] : [true, true, true, true, true, true, true];
    var lit = F ? [true, true, true, false, false, false, false] : [true, true, true, true, true, false, false];
    var segments = days.map(function (d, i) { return { color: lit[i] ? '#1EB955' : 'rgba(255,255,255,0.13)', offset: (-(i * 44.88) - 6).toFixed(2) }; });
    function fact(label, value, sub, d, t, ink) { return { label: label, value: value, sub: sub, d: d, tile: t + c.tileA, ink: D ? t : ink }; }
    var facts = [
      fact('Steadiest', 'Vitamin D', '7 of 7 days', 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4', '#E5A500', '#B07E00'),
      fact('Slipped', 'Omega-3', 'Missed Sat and Sun', 'M2.5 12c2.8-3.6 7.5-5 11.5-3.2L18.5 6v12L14 15.2C10 17 5.3 15.6 2.5 12z', '#13A39C', '#0F8A84'),
      fact('Day you tend to miss', 'Sunday', '3 of the last 4 weeks', 'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4', '#6B5BE0', '#5A4BCF'),
      fact('Streak', '10 days', 'Up from 3 last Sunday', 'M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z', '#E2674A', '#C64A2F')
    ];
    var pct = [0.62, 0.7, 0.55, 0.8, 0.66, 0.74, 0.69, 0.74];
    var labels = ['17 Aug', '24', '31', '7 Sep', '14', '21', '28', '5 Oct'];
    var C = 125.66;
    var weeks = pct.map(function (p, i) { var s = i === 7; return { dash: (p * C).toFixed(1) + ' ' + C, label: labels[i].split(' ')[0], aria: 'Week of ' + labels[i], sel: s ? 'true' : 'false', bg: s ? c.selBg : 'transparent', ink: s ? c.ink : c.ink2 }; });
    return { c: c, segments: segments, facts: facts, weeks: weeks, full: !F, first: F,
      ringValue: F ? '3' : '5/7', ringLabel: F ? 'days logged' : 'full days',
      range: F ? 'This week' : '5 – 11 October',
      headline: F ? 'Your first recap arrives Sunday' : '31 of 42 goals met',
      summary: F ? 'You’ve logged 3 days so far. Sunday’s recap will cover the whole week.' : 'You hit Vitamin D 7 of 7 days. Omega-3 slipped on the weekend. Caffeine went over your limit on Monday. Your streak is now 10 days.' };
  }
}
</script>
</body>
</html>
