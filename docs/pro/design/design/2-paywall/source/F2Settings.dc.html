<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Settings with Pro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.scrim}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <section aria-label="Settings" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: {{c.bg}}; border-radius: 38px 38px 0 0; padding: 8px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{c.grabber}}"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px; padding-left: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Settings</h1>
      <button style="height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: {{c.card}}; font: 600 16px -apple-system, system-ui, sans-serif; color: {{c.linkInk}}">Done</button>
    </div>

    <button style="margin-top: 14px; width: 100%; border: 0; text-align: left; padding: 12px 14px; border-radius: 22px; background: {{c.card}}; display: flex; align-items: center; gap: 14px; font-family: inherit; color: {{c.ink}}">
      <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 24px; background: #1B3B2D; color: #7BE3A0; display: flex; align-items: center; justify-content: center; font: 700 20px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">A</span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 17px; font-weight: 700">Alex</span>
        <span style="font-size: 14px; color: {{c.ink2}}">Edit profile</span>
      </span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </button>

    <a href="{{proHref}}" style="margin-top: 12px; position: relative; overflow: hidden; padding: 14px; border-radius: 22px; background: #1B3B2D; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #FFFFFF">
      <svg aria-hidden="true" width="140" height="140" viewBox="0 0 140 140" style="position: absolute; right: -40px; top: -48px">
        <circle cx="70" cy="70" r="52" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="16"></circle>
        <circle cx="70" cy="70" r="52" fill="none" stroke="#1EB955" stroke-width="16" stroke-linecap="round" stroke-dasharray="110 216.7" transform="rotate(-90 70 70)" opacity="0.5"></circle>
      </svg>
      <span aria-hidden="true" style="position: relative; width: 44px; height: 44px; border-radius: 13px; background: rgba(123,227,160,0.16); display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7BE3A0" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 8a4 4 0 1 0 4 4"></path></svg>
      </span>
      <span style="position: relative; flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="display: flex; align-items: center; gap: 8px">
          <span style="font-size: 17px; font-weight: 700">nutrx Pro</span>
          <sc-if value="{{pro}}" hint-placeholder-val="{{false}}">
            <span style="width: 18px; height: 18px; border-radius: 9px; background: #1EB955; display: flex; align-items: center; justify-content: center" role="img" aria-label="Active">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </span>
          </sc-if>
        </span>
        <span style="font-size: 14px; color: #B7CCBF">{{proLine}}</span>
      </span>
      <span style="position: relative; font-size: 15px; font-weight: 600; color: #7BE3A0">{{proCta}}</span>
      <svg style="position: relative" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7BE3A0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>

    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <div style="margin-top: 16px; border-radius: 22px; background: {{c.card}}; overflow: hidden">
        <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="4">
          <button style="width: 100%; min-height: 50px; border: 0; border-bottom: {{r.sep}}; background: transparent; padding: 0 14px; display: flex; align-items: center; gap: 12px; font: 400 16px -apple-system, system-ui, sans-serif; color: {{c.ink}}; text-align: left">
            <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
            </span>
            <span style="flex: 1">{{r.label}}</span>
            <sc-if value="{{r.badge}}" hint-placeholder-val="{{false}}">
              <span style="font: 800 10px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: 0.06em; padding: 4px 6px; border-radius: 6px; background: {{c.badgeBg}}; color: {{c.badgeInk}}">PRO</span>
            </sc-if>
            <span style="color: {{c.ink2}}; font-size: 15px">{{r.value}}</span>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
          </button>
        </sc-for>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"pro":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark, P = !!this.props.pro;
    var c = D ? { scrim: '#050A07', bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chev: '#5F7268', grabber: '#2C4035', line: '#22332A', linkInk: '#5BD88A', badgeBg: 'rgba(30,185,85,0.16)', badgeInk: '#7BE3A0' }
              : { scrim: '#2A3A31', bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chev: '#9AA69F', grabber: '#CBD3CA', line: '#EEF1EC', linkInk: '#1B3B2D', badgeBg: 'rgba(27,59,45,0.09)', badgeInk: '#1B3B2D' };
    function r(label, value, bg, d, badge) { return { label: label, value: value, bg: bg, d: d, badge: !!badge }; }
    var sections = [
      { rows: [
        r('iCloud Sync', 'On', '#2F80ED', 'M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9.5 4.3 4.3 0 0 0 7 18z'),
        r('Notifications', 'Noon check-in', '#D2563A', 'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0'),
        r('Streaks', 'On', '#1B8A47', 'M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z'),
        r('Groups', '2', '#6B5BE0', 'M3 7h6l2 2h10v10H3z'),
        r('Stacks', '3', '#13A39C', 'M12 3l9 4.5-9 4.5-9-4.5zM3 12l9 4.5 9-4.5M3 16.5l9 4.5 9-4.5')
      ]},
      { rows: [
        r('Apple Health', P ? 'Connected' : '', '#E2674A', 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z', !P),
        r('Export data', '', '#56655C', 'M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6'),
        r('Report for your doctor', '', '#2F80ED', 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5', !P)
      ]}
    ];
    sections.forEach(function (s) { s.rows.forEach(function (row, i) { row.sep = i === s.rows.length - 1 ? '0' : '1px solid ' + c.line; }); });
    return { c: c, pro: P, sections: sections,
      proLine: P ? 'Yearly · renews 14 Oct 2027' : 'Supply, label scan, recaps and more',
      proCta: P ? '' : 'Learn more', proHref: P ? 'F2ProScreen.dc.html' : 'F2Paywall.dc.html' };
  }
}
</script>
</body>
</html>
