<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — paywall at the largest text size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 1160px; position: relative; overflow: hidden; background: #F2F4EF; color: #0E1A13; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <header style="background: #1B3B2D; color: #FFFFFF; padding: 70px 20px 24px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font: 800 44px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">nutrx</span>
      <span style="font: 800 20px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #0E1A13; background: #7BE3A0; padding: 7px 10px; border-radius: 9px">PRO</span>
    </div>
    <p style="margin: 0; font-size: 26px; line-height: 33px; color: #CFE0D5">More around your tracking. It all runs on your iPhone.</p>
  </header>

  <ul style="list-style: none; margin: 0; padding: 14px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{features}}" as="f" hint-placeholder-count="5">
      <li style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 26px; line-height: 32px; font-weight: 600">{{f.title}}</span>
        <span style="font-size: 22px; line-height: 28px; color: #56655C">{{f.line}}</span>
      </li>
    </sc-for>
  </ul>

  <div style="padding: 22px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">
    <button role="radio" aria-checked="true" style="padding: 14px 16px; border-radius: 16px; border: 3px solid #1B3B2D; background: #FFFFFF; text-align: left; font-family: inherit; color: #0E1A13; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 26px; font-weight: 600">Yearly · <span style="font: 700 26px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">$14.99</span></span>
      <span style="font-size: 20px; font-weight: 700; color: #137A3A">1 week free</span>
    </button>
    <button role="radio" aria-checked="false" style="padding: 14px 16px; border-radius: 16px; border: 3px solid transparent; background: #FFFFFF; text-align: left; font-family: inherit; color: #0E1A13; font-size: 26px; font-weight: 600">Monthly · <span style="font: 700 26px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">$1.99</span></button>
    <button role="radio" aria-checked="false" style="padding: 14px 16px; border-radius: 16px; border: 3px solid transparent; background: #FFFFFF; text-align: left; font-family: inherit; color: #0E1A13; font-size: 26px; font-weight: 600">Lifetime · <span style="font: 700 26px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">$29.99</span></button>
    <button style="margin-top: 6px; min-height: 72px; border-radius: 20px; border: 0; background: #1B3B2D; color: #FFFFFF; font: 600 28px -apple-system, system-ui, sans-serif">Start free week</button>
    <p style="margin: 0; font-size: 20px; line-height: 26px; color: #56655C; text-align: center">1 week free, then $14.99 a year.</p>
    <p style="margin: 8px 0 0 0; font-size: 22px; line-height: 28px; font-weight: 600; color: #137A3A; text-align: center">Everything you use today stays free.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    return { features: [
      { title: 'Supply & refills', line: 'Know when a bottle runs out' },
      { title: 'Scan a label', line: 'Add a nutrient from its bottle' },
      { title: 'Weekly recap', line: 'Your week, summarised' },
      { title: 'Trends with Apple Health', line: 'Intake against sleep and workouts' },
      { title: 'A report for your doctor', line: 'A PDF of any period' }
    ] };
  }
}
</script>
</body>
</html>
