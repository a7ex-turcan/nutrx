<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx Pro — create report at the largest text size</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 720px; position: relative; overflow: hidden; background: #F2F4EF; color: #0E1A13; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 62px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
  <h1 style="margin: 0 4px; font-size: 40px; line-height: 48px; font-weight: 700">Report for your doctor</h1>
  <span style="margin: 8px 4px 0 4px; font-size: 22px; font-weight: 700; color: #56655C">PERIOD</span>
  <div role="radiogroup" aria-label="Period" style="border-radius: 22px; background: #FFFFFF; overflow: hidden">
    <button role="radio" aria-checked="false" style="width: 100%; min-height: 68px; border: 0; border-bottom: 1px solid #EEF1EC; background: transparent; padding: 0 18px; text-align: left; font: 400 28px -apple-system, system-ui, sans-serif; color: #0E1A13">Last 30 days</button>
    <button role="radio" aria-checked="true" style="width: 100%; min-height: 68px; border: 0; border-bottom: 1px solid #EEF1EC; background: transparent; padding: 0 18px; text-align: left; font: 600 28px -apple-system, system-ui, sans-serif; color: #0E1A13; display: flex; align-items: center; justify-content: space-between">Last 90 days <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1B3B2D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
    <button role="radio" aria-checked="false" style="width: 100%; min-height: 68px; border: 0; background: transparent; padding: 0 18px; text-align: left; font: 400 28px -apple-system, system-ui, sans-serif; color: #0E1A13">Custom range</button>
  </div>
  <div style="border-radius: 22px; background: #FFFFFF; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
    <label for="ax1" style="font-size: 28px; line-height: 34px">Include notes</label>
    <button role="switch" id="ax1" aria-checked="true" style="align-self: flex-start; border: 0; padding: 0; width: 64px; height: 39px; border-radius: 20px; background: #1EB955; position: relative"><span style="position: absolute; right: 3px; top: 3px; width: 33px; height: 33px; border-radius: 17px; background: #FFFFFF"></span></button>
  </div>
  <button style="margin-top: 10px; min-height: 76px; border-radius: 20px; border: 0; background: #1B3B2D; color: #FFFFFF; font: 600 30px -apple-system, system-ui, sans-serif">Create PDF</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":393,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
