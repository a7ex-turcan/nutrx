<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Today with stacks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

  <div style="padding: 62px 20px 0 20px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.ink2}}">Wednesday, 14 October</div>
      <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">Today</h1>
    </div>
    <button aria-label="Profile menu" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.avatarBg}}; color: {{c.avatarInk}}; font: 600 17px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">A</button>
  </div>

  <section style="margin: 14px 16px 0 16px; padding: 16px 18px; border-radius: 28px; background: #1B3B2D; display: flex; align-items: center; gap: 18px">
    <div style="position: relative; width: 92px; height: 92px; flex: none">
      <svg width="92" height="92" viewBox="0 0 116 116" aria-hidden="true">
        <sc-for list="{{segments}}" as="s" hint-placeholder-count="6">
          <circle cx="58" cy="58" r="50" fill="none" stroke="{{s.color}}" stroke-width="12" stroke-linecap="round" stroke-dasharray="34.4 279.8" stroke-dashoffset="{{s.offset}}" transform="rotate(-90 58 58)"></circle>
        </sc-for>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font: 700 27px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #FFFFFF">{{metCount}}<span style="color: #9FC2AE">/6</span></div>
        <div style="font-size: 11px; font-weight: 600; color: #B7CCBF; margin-top: 3px">goals met</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
      <div style="font-size: 18px; line-height: 23px; font-weight: 700; color: #FFFFFF">{{heroTitle}}</div>
      <div style="display: flex; align-items: center; gap: 6px; align-self: flex-start; padding: 5px 10px 5px 8px; border-radius: 999px; background: rgba(255,255,255,0.10)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="#7BE3A0" aria-hidden="true"><path d="{{I.flame}}"></path></svg>
        <span style="font: 600 13px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #FFFFFF">10-day streak</span>
      </div>
    </div>
  </section>

  <div style="margin-top: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 10px 20px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Stacks</h2>
      <button style="height: 32px; padding: 0 2px; border: 0; background: transparent; font: 600 15px -apple-system, system-ui, sans-serif; color: {{c.linkInk}}">Edit</button>
    </div>

    <sc-if value="{{one}}" hint-placeholder-val="{{false}}">
      <div style="margin: 0 16px; padding: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: flex; align-items: center; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0">
          <div style="font-size: 16px; font-weight: 600">Morning</div>
          <div style="display: flex; align-items: center; gap: 6px">
            <sc-for list="{{stacks.0.icons}}" as="ic" hint-placeholder-count="3">
              <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; background: {{ic.tile}}; display: flex; align-items: center; justify-content: center">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{ic.tint}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.d}}"></path></svg>
              </span>
            </sc-for>
            <span style="font-size: 13px; color: {{c.ink2}}; margin-left: 2px">3 nutrients</span>
          </div>
        </div>
        <button style="height: 44px; padding: 0 22px; border-radius: 22px; border: 0; background: {{c.btn}}; color: {{c.btnInk}}; font: 600 16px -apple-system, system-ui, sans-serif; display: flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg>
          Log
        </button>
      </div>
    </sc-if>

    <sc-if value="{{many}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 10px; padding: 0 16px; overflow: hidden">
        <sc-for list="{{stacks}}" as="s" hint-placeholder-count="3">
          <div style="width: 176px; flex: none; padding: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px">
              <span style="font-size: 16px; font-weight: 600">{{s.title}}</span>
              <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}">
                <span role="img" aria-label="Logged today" style="width: 20px; height: 20px; border-radius: 10px; background: #1EB955; display: flex; align-items: center; justify-content: center">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.check}}"></path></svg>
                </span>
              </sc-if>
            </div>
            <div style="display: flex; align-items: center; gap: 5px">
              <sc-for list="{{s.icons}}" as="ic" hint-placeholder-count="3">
                <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 7px; background: {{ic.tile}}; display: flex; align-items: center; justify-content: center">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{ic.tint}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ic.d}}"></path></svg>
                </span>
              </sc-for>
            </div>
            <button style="height: 44px; border-radius: 22px; border: {{s.btnBorder}}; background: {{s.btnBg}}; color: {{s.btnInk}}; font: 600 15px -apple-system, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; gap: 6px">{{s.cta}}</button>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div style="margin-top: 22px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 20px 10px 20px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Vitamins &amp; minerals</h2>
      <span style="font: 600 13px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: {{c.ink2}}; padding: 4px 8px; border-radius: 999px; background: {{c.chip}}">2/3</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px">
      <sc-for list="{{cards}}" as="n" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}">
          <div style="position: relative; width: 52px; height: 52px; flex: none">
            <svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
              <circle cx="26" cy="26" r="22" fill="none" stroke="{{n.track}}" stroke-width="5"></circle>
              <circle cx="26" cy="26" r="22" fill="none" stroke="{{n.tint}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="{{n.dash}}" transform="rotate(-90 26 26)"></circle>
            </svg>
            <svg style="position: absolute; left: 15px; top: 15px" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{n.tint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
            <sc-if value="{{n.done}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 10px; background: #1EB955; border: 2px solid {{c.card}}; display: flex; align-items: center; justify-content: center">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0E1A13" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.check}}"></path></svg>
              </div>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <div style="font-size: 16px; font-weight: 600">{{n.title}}</div>
            <div style="display: flex; align-items: baseline; gap: 4px">
              <span style="font: 700 16px/1.2 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{n.cur}}</span>
              <span style="font-size: 13px; color: {{c.ink2}}">{{n.of}}</span>
            </div>
            <div style="font-size: 12px; font-weight: 600; color: {{n.statusColor}}">{{n.status}}</div>
          </div>
          <div style="display: flex; gap: 8px; flex: none">
            <button aria-label="Remove one step of {{n.title}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid {{c.ghost}}; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{I.minus}}"></path></svg>
            </button>
            <button aria-label="Add one step of {{n.title}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.btn}}; display: flex; align-items: center; justify-content: center">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.btnInk}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg>
            </button>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Tabs" style="position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 34px; background: {{c.glass}}; border: 1px solid {{c.glassBorder}}; backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: 0 12px 32px -12px rgba(14,26,19,0.35)">
    <a href="Main.dc.html" style="width: 92px; height: 54px; border-radius: 28px; background: {{c.tabOnBg}}; color: {{c.tabOn}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path><path d="M12 8a4 4 0 1 0 4 4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Today</span>
    </a>
    <a href="F1Stacks.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: {{c.ink2}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10.5 11 5 20 4c0 9-5.5 15-14 15zM5 19l7-7"></path></svg>
      <span style="font-size: 10px; font-weight: 600">Nutrients</span>
    </a>
    <a href="F5History.dc.html" style="width: 92px; height: 54px; border-radius: 28px; color: {{c.ink2}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v15H4zM4 10h16M8 3v4M16 3v4"></path></svg>
      <span style="font-size: 10px; font-weight: 600">History</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"stacks":{"editor":"enum","options":["3","1"],"default":"3"},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark;
    var c = D ? {
      bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', chip: 'rgba(255,255,255,0.07)',
      shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', avatarBg: '#1B3B2D', avatarInk: '#7BE3A0',
      ghost: '#2C4035', btn: '#1EB955', btnInk: '#0A130E', linkInk: '#5BD88A', greenInk: '#5BD88A', amberInk: '#F0B35A',
      glass: 'rgba(28,42,34,0.78)', glassBorder: 'rgba(255,255,255,0.08)', tabOnBg: 'rgba(30,185,85,0.16)', tabOn: '#7BE3A0', tileA: '33'
    } : {
      bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', chip: 'rgba(14,26,19,0.06)',
      shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', avatarBg: '#DCE7DF', avatarInk: '#1B3B2D',
      ghost: '#D5DCD3', btn: '#1B3B2D', btnInk: '#FFFFFF', linkInk: '#1B3B2D', greenInk: '#137A3A', amberInk: '#9A5A0C',
      glass: 'rgba(255,255,255,0.78)', glassBorder: 'rgba(14,26,19,0.08)', tabOnBg: 'rgba(27,59,45,0.10)', tabOn: '#1B3B2D', tileA: '2E'
    };
    var I = {
      sun: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4',
      fish: 'M2.5 12c2.8-3.6 7.5-5 11.5-3.2L18.5 6v12L14 15.2C10 17 5.3 15.6 2.5 12z',
      pill: 'M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7zM7 7l7 7',
      drop: 'M12 3c0 0 6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',
      moon: 'M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z',
      leaf: 'M5 19C5 10.5 11 5 20 4c0 9-5.5 15-14 15zM5 19l7-7',
      flame: 'M12 3c.8 3 4.5 4.8 4.5 9.5a4.5 4.5 0 0 1-9 0c0-2.2 1.2-3.6 2.2-4.5.3 1.6 1.1 2.6 2.1 2.6-.3-2.6-.6-4.9.2-7.6z',
      check: 'M5 12.5l4.5 4.5L19 7.5', plus: 'M12 5v14M5 12h14', minus: 'M5 12h14'
    };
    var T = { amber: '#E5A500', teal: '#13A39C', indigo: '#6B5BE0', blue: '#2F80ED', green: '#1EB955', pink: '#D9539A' };
    function ic(icon, t) { return { d: I[icon], tint: T[t], tile: T[t] + c.tileA }; }
    function stack(title, icons, done) {
      return { title: title, icons: icons, done: done, cta: done ? 'Log again' : 'Log',
        btnBg: done ? 'transparent' : c.btn, btnInk: done ? c.ink2 : c.btnInk, btnBorder: done ? '1.5px solid ' + c.ghost : '0' };
    }
    var one = String(this.props.stacks ?? '3') === '1';
    var stacks = one
      ? [stack('Morning', [ic('sun', 'amber'), ic('fish', 'teal'), ic('pill', 'indigo')], false)]
      : [
        stack('Morning', [ic('sun', 'amber'), ic('fish', 'teal'), ic('pill', 'indigo')], true),
        stack('With dinner', [ic('leaf', 'green'), ic('fish', 'teal')], false),
        stack('Before bed', [ic('moon', 'blue'), ic('pill', 'indigo')], false)
      ];
    var C = 138.23;
    function n(title, icon, t, frac, cur, of, status, kind) {
      return { title: title, icon: I[icon], tint: T[t], track: T[t] + (D ? '33' : '26'), dash: (Math.min(frac, 1) * C).toFixed(1) + ' ' + C,
        cur: cur, of: of, status: status, statusColor: kind === 'done' ? c.greenInk : c.ink2, done: kind === 'done' };
    }
    var cards = one ? [
      n('Vitamin D', 'sun', 'amber', 0, '0', '/ 4,000 IU', '4,000 IU to go', 'todo'),
      n('Omega-3', 'fish', 'teal', 0, '0', '/ 2,000 mg', '2,000 mg to go', 'todo'),
      n('Magnesium', 'pill', 'indigo', 0, '0', '/ 400 mg', '400 mg to go', 'todo')
    ] : [
      n('Vitamin D', 'sun', 'amber', 0.5, '2,000', '/ 4,000 IU', '2,000 IU to go', 'todo'),
      n('Omega-3', 'fish', 'teal', 1, '2,000', '/ 2,000 mg', 'Done', 'done'),
      n('Magnesium', 'pill', 'indigo', 1, '400', '/ 400 mg', 'Done', 'done')
    ];
    var met = one ? [false, false, false, false, false, false] : [true, true, true, false, false, false];
    var segments = met.map(function (m, i) { return { color: m ? '#1EB955' : 'rgba(255,255,255,0.13)', offset: (-(i * 52.36) - 8.5).toFixed(2) }; });
    return { metCount: one ? '0' : '3', heroTitle: one ? 'Let’s get started' : 'Halfway there — 3 to go', c: c, I: I, stacks: stacks, one: one, many: !one, cards: cards, segments: segments };
  }
}
</script>
</body>
</html>
