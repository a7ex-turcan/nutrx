<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx — Stack detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.scrim}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
  <section aria-label="Morning stack" style="position: absolute; left: 0; right: 0; top: 54px; bottom: 0; background: {{c.bg}}; border-radius: 38px 38px 0 0; padding: 8px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column">
    <div aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: {{c.grabber}}"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
      <a href="F1Stacks.dc.html" style="height: 44px; padding: 0 14px 0 8px; border-radius: 22px; background: {{c.card}}; display: flex; align-items: center; gap: 2px; text-decoration: none; color: {{c.ink}}; font-size: 16px; font-weight: 600">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        Stacks
      </a>
      <span style="font-size: 17px; font-weight: 700">Stack</span>
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{c.card}}; color: {{c.ink}}; font: 600 16px -apple-system, system-ui, sans-serif">Edit</button>
    </div>

    <div style="margin-top: 16px; padding: 10px 14px; border-radius: 20px; background: {{c.card}}; display: flex; flex-direction: column; gap: 2px">
      <label for="sn" style="font-size: 12px; font-weight: 600; color: {{c.ink2}}">Name</label>
      <input id="sn" value="Morning" style="border: 0; padding: 0; height: 28px; font: 600 20px -apple-system, system-ui, sans-serif; color: {{c.ink}}; outline: none; background: transparent">
    </div>

    <h2 style="margin: 20px 4px 8px 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.ink2}}">Nutrients &amp; amounts</h2>
    <div style="border-radius: 22px; background: {{c.card}}; box-shadow: {{c.shadow}}; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 8px 10px 12px; border-bottom: 1px solid {{c.line}}">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: {{r.tile}}; display: flex; align-items: center; justify-content: center; flex: none">
            <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{r.tint}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
          </span>
          <span style="flex: 1; min-width: 0; font-size: 16px; font-weight: 600">{{r.title}}</span>
          <div style="display: flex; align-items: center; border-radius: 22px; background: {{c.chip}}">
            <button aria-label="Less {{r.title}}" style="width: 40px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <span style="min-width: 66px; text-align: center; font: 700 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{r.amount}}</span>
            <button aria-label="More {{r.title}}" style="width: 40px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
          <span aria-label="Reorder" role="img" style="width: 28px; height: 44px; display: flex; align-items: center; justify-content: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"></path></svg>
          </span>
        </div>
      </sc-for>
      <button style="width: 100%; height: 52px; border: 0; background: transparent; display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 600 16px -apple-system, system-ui, sans-serif; color: {{c.linkInk}}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        Add nutrient
      </button>
    </div>
    <p style="margin: 8px 4px 0 4px; font-size: 13px; line-height: 18px; color: {{c.ink2}}">Amounts start at each nutrient's step. You can still change them each time you log.</p>

    <div style="margin-top: 18px; padding: 14px; border-radius: 20px; background: {{c.tipBg}}; display: flex; align-items: flex-start; gap: 12px">
      <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 11px; background: {{c.tipTile}}; display: flex; align-items: center; justify-content: center; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.tipInk}}" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"></path></svg>
      </span>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">Say “Log my Morning stack” to Siri</span>
        <span style="font-size: 13px; line-height: 18px; color: {{c.ink2}}">Also works from the Shortcuts app and your Apple Watch.</span>
      </div>
      <button aria-label="Dismiss tip" style="width: 32px; height: 32px; margin: -4px -4px 0 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.ink2}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>

    <button style="margin-top: 18px; height: 52px; border-radius: 18px; border: 0; background: {{c.card}}; color: {{c.danger}}; font: 600 16px -apple-system, system-ui, sans-serif">Delete stack</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":393,"height":852}}'>
class Component extends DCLogic {
  renderVals() {
    var D = !!this.props.dark;
    var c = D ? {
      scrim: '#050A07', bg: '#0A130E', card: '#142019', ink: '#EAF2EC', ink2: '#97AA9E', shadow: 'inset 0 0 0 1px rgba(255,255,255,0.06)', chip: 'rgba(255,255,255,0.07)',
      grabber: '#2C4035', line: '#22332A', chev: '#5F7268', linkInk: '#5BD88A', tipBg: '#142019', tipTile: 'rgba(30,185,85,0.16)', tipInk: '#5BD88A', danger: '#FF6B5E', tileA: '33'
    } : {
      scrim: '#2A3A31', bg: '#F2F4EF', card: '#FFFFFF', ink: '#0E1A13', ink2: '#56655C', shadow: '0 1px 0 rgba(14,26,19,0.04), 0 8px 20px -14px rgba(27,59,45,0.30)', chip: 'rgba(14,26,19,0.06)',
      grabber: '#CBD3CA', line: '#EEF1EC', chev: '#9AA69F', linkInk: '#1B3B2D', tipBg: 'rgba(27,59,45,0.06)', tipTile: '#FFFFFF', tipInk: '#1B3B2D', danger: '#C4321F', tileA: '2E'
    };
    function r(title, d, t, amount) { return { title: title, d: d, tint: t, tile: t + c.tileA, amount: amount }; }
    return { c: c, rows: [
      r('Vitamin D', 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4', '#E5A500', '2,000 IU'),
      r('Omega-3', 'M2.5 12c2.8-3.6 7.5-5 11.5-3.2L18.5 6v12L14 15.2C10 17 5.3 15.6 2.5 12z', '#13A39C', '1,000 mg'),
      r('Magnesium', 'M10.5 3.5a5 5 0 0 1 7 7l-7 7a5 5 0 0 1-7-7zM7 7l7 7', '#6B5BE0', '400 mg')
    ] };
  }
}
</script>
</body>
</html>
