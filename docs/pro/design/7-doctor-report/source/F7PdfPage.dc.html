<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nutrx report — nutrient page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 794px; height: 1123px; box-sizing: border-box; padding: 56px 72px 56px 72px; background: #FFFFFF; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #BBBBBB; font-size: 13px; color: #444444">
    <span style="font: 800 15px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #111111">nutrx</span>
    <span>Intake report · 16 July – 13 October 2026</span>
  </header>

  <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
    <section style="margin-top: 30px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 24px; font-weight: 700">{{s.title}}</h2>
        <span style="font-size: 15px; color: #333333">Goal: {{s.goal}}</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <sc-for list="{{s.stats}}" as="t" hint-placeholder-count="3">
          <div style="padding: 10px 12px; border: 1px solid #BBBBBB; border-radius: 8px; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 13px; color: #555555">{{t.label}}</span>
            <span style="font: 700 22px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">{{t.value}}</span>
          </div>
        </sc-for>
      </div>
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 6px">
        <div role="img" aria-label="{{s.aria}}" style="position: relative; height: 130px; border-bottom: 1.5px solid #111111; display: flex; align-items: flex-end; gap: 2px">
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: {{s.goalY}}; border-top: 1.5px dashed #111111"></span>
          <sc-for list="{{s.bars}}" as="b" hint-placeholder-count="90">
            <span style="flex: 1; height: {{b.h}}; background: {{b.fill}}"></span>
          </sc-for>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #555555"><span>16 Jul</span><span>Aug</span><span>Sep</span><span>13 Oct</span></div>
        <figcaption style="font-size: 12px; color: #555555">Daily totals. Dark bars met the goal; light bars didn't. Dashed line: goal.</figcaption>
      </figure>
    </section>
  </sc-for>

  <section style="margin-top: 30px">
    <h2 style="margin: 0 0 10px 0; font-size: 20px; font-weight: 700">Notes</h2>
    <div role="table" aria-label="Notes" style="font-size: 15px; line-height: 21px">
      <sc-for list="{{notes}}" as="n" hint-placeholder-count="3">
        <div role="row" style="display: grid; grid-template-columns: 90px 120px minmax(0, 1fr); padding: 8px 0; border-top: 1px solid #BBBBBB">
          <span role="cell" style="color: #444444">{{n.d}}</span><span role="cell" style="font-weight: 600">{{n.k}}</span><span role="cell">{{n.t}}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <div style="flex: 1"></div>
  <footer style="padding-top: 12px; border-top: 1px solid #BBBBBB; display: flex; justify-content: space-between; font-size: 12px; color: #555555">
    <span>Generated by nutrx on 14 Oct 2026</span>
    <span>page 2 of 4</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":794,"height":1123}}'>
class Component extends DCLogic {
  renderVals() {
    function bars(goal, max, seed, missRate) {
      var out = [], x = seed;
      for (var i = 0; i < 90; i++) {
        x = (x * 9301 + 49297) % 233280; var r = x / 233280;
        var v = r < missRate ? goal * (0.3 + r * 1.2) : goal * (1 + (r - missRate) * 0.4);
        out.push({ h: Math.round(Math.min(v, max) / max * 126) + 'px', fill: v >= goal ? '#222222' : '#BDBDBD' });
      }
      return out;
    }
    return {
      sections: [
        { title: 'Vitamin D', goal: 'at least 4,000 IU', aria: 'Vitamin D daily totals over 90 days', goalY: Math.round(4000 / 6000 * 126) + 'px', bars: bars(4000, 6000, 7, 0.17),
          stats: [ { label: 'Hit rate', value: '83%' }, { label: 'Average', value: '3,830 IU' }, { label: 'Days logged', value: '88' } ] },
        { title: 'Omega-3', goal: 'at least 2,000 mg', aria: 'Omega-3 daily totals over 90 days', goalY: Math.round(2000 / 3000 * 126) + 'px', bars: bars(2000, 3000, 31, 0.29),
          stats: [ { label: 'Hit rate', value: '71%' }, { label: 'Average', value: '1,740 mg' }, { label: 'Days logged', value: '86' } ] }
      ],
      notes: [
        { d: '2 Aug', k: 'Vitamin D', t: 'Switched to 2,000 IU softgels' },
        { d: '19 Sep', k: 'Omega-3', t: 'Stopped while travelling, 3 days' },
        { d: '6 Oct', k: 'Magnesium', t: 'Taking with dinner instead of breakfast' }
      ]
    };
  }
}
</script>
</body>
</html>
