</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 393px; height: 852px; position: relative; overflow: hidden; background: {{c.bg}}; color: {{c.ink}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: 62px 16px 0 16px; box-sizing: border-box; display: flex; flex-direction: column">
  <span style="margin: 0 6px 10px 6px; font-size: 12px; font-weight: 600; color: {{c.ink2}}">History toolbar</span>
  <div style="padding: 0 4px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: -0.02em">History</h1>
    <div style="display: flex; gap: 8px">
      <a href="F2Paywall.dc.html" aria-label="Report for your doctor, nutrx Pro" style="position: relative; width: 44px; height: 44px; border-radius: 22px; background: {{c.card}}; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h6"></path></svg>

      </a>
      <button aria-label="Profile menu" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{c.avatarBg}}; color: {{c.avatarInk}}; font: 600 17px/1 ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif">A</button>
    </div>
  </div>

  <span style="margin: 32px 6px 10px 6px; font-size: 12px; font-weight: 600; color: {{c.ink2}}">Long press on the toolbar button</span>
  <div style="align-self: flex-end; width: 250px; border-radius: 18px; background: {{c.card}}; box-shadow: 0 18px 40px -12px rgba(14,26,19,0.35); overflow: hidden">
    <div style="padding: 12px 14px; display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Report for your doctor</span><span style="font-size: 13px; color: {{c.ink2}}">A PDF of any period</span></span>
      <span style="font: 800 10px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: 0.06em; padding: 4px 6px; border-radius: 6px; background: {{c.badgeBg}}; color: {{c.badgeInk}}">PRO</span>
    </div>
  </div>

  <span style="margin: 32px 6px 10px 6px; font-size: 12px; font-weight: 600; color: {{c.ink2}}">Settings</span>
  <div style="border-radius: 22px; background: {{c.card}}; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <a href="{{r.href}}" style="min-height: 50px; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: {{c.ink}}; border-bottom: {{r.sep}}">
        <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 8px; background: {{r.bg}}; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg>
        </span>
        <span style="flex: 1; font-size: 16px">{{r.label}}</span>
        <sc-if value="{{r.pro}}" hint-placeholder-val="{{false}}">
          <span style="font: 800 10px ui-rounded, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; letter-spacing: 0.06em; padding: 4px 6px; border-radius: 6px; background: {{c.badgeBg}}; color: {{c.badgeInk}}">PRO</span>
        </sc-if>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{c.chev}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>

    var rows = [
      { label: 'Apple Health', bg: '#E2674A', d: 'M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z', pro: true, href: 'F2Paywall.dc.html' },
      { label: 'Export data', bg: '#56655C', d: 'M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6', pro: false, href: 'F1Export.dc.html' },
      { label: 'Report for your doctor', bg: '#2F80ED', d: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5', pro: true, href: 'F2Paywall.dc.html' }
    ];
    rows.forEach(function (r, i) { r.sep = i === 2 ? '0' : '1px solid ' + c.line; });

</script>
</body>
</html>
